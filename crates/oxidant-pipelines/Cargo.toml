[package]
name = "oxidant-pipelines"
description = "Declarative table DAG runner: graph planning, expectations, and micro-batch execution."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
# `reconcile --cron` evaluates a schedule and stamps its runs; the connector log already
# timestamps with chrono, so the two agree on what an instant looks like on disk.
chrono = { version = "0.4", features = ["serde"] }
datafusion = "54"
oxidant-common = { workspace = true }
oxidant-config = { workspace = true }
oxidant-loom = { workspace = true }
oxidant-streaming = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "macros"] }

[dev-dependencies]
# The live reconcile suite runs a whole pipeline into a temp warehouse, so it needs the same
# catalog provider the server builds — registered directly rather than through oxidant-connect,
# which depends on this crate.
oxidant-catalog-local = { workspace = true }
tempfile = "3"
