[package]
name = "oxidant-loom"
description = "The CPU engine: vectorized Arrow execution. Embeds DataFusion in Phase 0, carves out native heavy operators in Phase 1."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
oxidant-common = { workspace = true }
oxidant-plan = { workspace = true }
# The Spark-SQL dialect layer: `normalize_spark_sql` runs its Stage-1 string-prefilter registry.
oxidant-sql = { workspace = true }
oxidant-physical = { workspace = true }
oxidant-datasource = { workspace = true }
oxidant-catalog = { workspace = true }
# KAN-70 GPU offload spike: registers its conservative plan rule into the engine's
# physical optimizer pipeline only when OXIDANT_GPU_OFFLOAD=1 (see
# `physical_optimizer_rules` in src/lib.rs). Default builds link its CPU mock shim.
oxidant-gpu = { workspace = true }
async-trait = "0.1"
# Phase 0 backend. The whole workspace shares this one `arrow` (re-exported below) so
# Arrow IPC bytes produced here line up with whatever encodes them downstream.
# Phase 1 carves out native operators on the ~10 heavy ClickBench queries.
datafusion = "54"
# Direct handle on `DFParquetMetadata` / `apply_file_schema_type_coercions` for the KAN-143
# column-statistics trust check in `catalog_bridge` (the umbrella crate re-exports only the
# deprecated free-function wrappers). Already in the tree as datafusion's own parquet
# datasource at exactly this version — pinned so the lock entry is reused, no new dep tree.
datafusion-datasource-parquet = "=54.1.0"
# Read table data from object stores (S3) for Glue/Hive locations on `s3://`. Pinned to the same
# 0.13 line DataFusion pulls so the `ObjectStore` trait/types unify; `aws` adds the S3 client + the
# EC2 instance-role (IMDS) credential provider — no static keys.
object_store = { version = "0.13", features = ["aws"] }
# `StreamExt::next` to drain streams; file-list sharding also streams object-store listings.
futures = "0.3"
# Data-parallel aggregation of independent key-hash partitions (the native GROUP BY carve-out).
rayon = "1"
# Spark `split(str, regex)` and other regex-based string UDFs (Spark splits on a regex, unlike
# DataFusion's `split_part`). Same major line DataFusion already pulls, so the dep tree stays unified.
regex = "1"
# Spark JSON UDFs (get_json_object / json_array_length / json_object_keys / to_json). Already in the
# tree via DataFusion/arrow-json, so the lock resolves to the same versions — no new dependency tree.
serde = "1"
serde_json = "1"
# Spark `from_json` parses date/timestamp leaves with Spark format patterns; chrono is already in the
# tree via arrow (same 0.4 line), so the lock resolves to the existing version — no new dep tree.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `register_table`'s CTAS write path builds its own fresh runtime on a dedicated OS thread (the
# DataFusion trait method is sync, but Glue/Hive/object-store writes are async) — needs `rt` in
# [dependencies], not just as a test-only dev-dependency. `sync` adds `tokio::sync::Mutex`, used by
# assume_role_credentials.rs to serialize concurrent STS AssumeRole calls (held across an await —
# a std::sync::Mutex must never be held across one).
tokio = { version = "1", features = ["rt", "sync"] }
# Names the `ObjectStore::get_ranges` return type in `s3_cache` (production) and catalog_bridge's
# request-counting test store. Same `bytes` the lock already resolves for datafusion — no new
# dependency tree.
bytes = "1"
# Cache-population/eviction counters in `dim_cache` — the worker (oxidant-execution) initializes the
# subscriber, so these events land in its usual log stream.
tracing = "0.1"
# `sts:AssumeRole` for the Hadoop-AWS `fs.s3a.assumed.role.arn` config equivalent (see
# assume_role_credentials.rs) — hand-rolling signed STS calls isn't worth the correctness risk
# for this one call type, so this pulls in the official SDK rather than extending object_store's
# own (crate-private) request-signing code. Pinned (not "1") to versions whose MSRV matches this
# workspace's toolchain — newer releases require a rustc this repo doesn't pin to yet.
aws-config = "=1.8.13"
aws-sdk-sts = "=1.97.0"
# Host / cgroup RAM detection for the default bounded spill pool when
# `OXIDANT_MEMORY_LIMIT_BYTES` is unset (see `resolve_memory_pool_bytes`). Same 0.33
# line `oxidant-connect` already uses for process metrics.
sysinfo = "0.33"

[dev-dependencies]
delta_kernel = { version = "=0.25.0", features = ["arrow-58"] }
delta_kernel_default_engine = "=0.25.0"
iceberg = { version = "=0.8.0", default-features = false, features = ["storage-fs"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
