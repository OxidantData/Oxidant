[package]
name = "oxidant-streaming"
description = "Spark Structured Streaming micro-batch engine for Oxidant."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
oxidant-common = { workspace = true }
oxidant-catalog = { workspace = true }
oxidant-datasource = { workspace = true }
oxidant-loom = { workspace = true }
datafusion = "54"
# Kafka client. Deliberately NOT `rdkafka`: that binds librdkafka, a large external system
# library that has to be installed (or vendored and built with cmake) on the aarch64 AMI, the CI
# image, and every contributor's machine. rskafka is pure Rust, and its narrow API — fetch a
# partition from an offset — is exactly what Structured Streaming needs, since Spark's Kafka
# source assigns partitions and keeps offsets in the query checkpoint instead of using consumer
# groups.
#
# The compression features cover the four codecs a Kafka producer can choose; a batch written
# with a codec we did not enable is unreadable, so all four are on. `compression-lz4` and
# `compression-zstd` bind vendored C (lz4-sys / zstd-sys) built by `cc` — already required by the
# tree, which links zstd-sys for Parquet.
rskafka = { version = "0.6", default-features = false, features = [
  "compression-gzip",
  "compression-lz4",
  "compression-snappy",
  "compression-zstd",
] }
object_store = { version = "=0.13.2", features = ["aws"] }
url = "2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
futures = "0.3.33"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }

# Postgres CDC. `tokio-postgres` is the control connection — validation, catalog introspection
# and slot metrics are ordinary SQL, and a mature client is the right tool for them. It does
# *not* speak the replication protocol (0.7.18 has no `replication=database` startup parameter
# and no CopyBoth API), so `pg_replication.rs` opens that one socket itself on top of
# `postgres-protocol`, the message-framing/SCRAM crate `tokio-postgres` is already built on.
# That is protocol plumbing, not a replication framework: the pgoutput decode is hand-rolled.
tokio-postgres = "0.7"
postgres-protocol = "0.6"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
# Pinned to `ring` because the tree already builds both providers (aws-lc-rs arrives through
# reqwest), and `ClientConfig::builder()` panics when it cannot pick between them.
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
bytes = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
oxidant-catalog-local = { workspace = true }
