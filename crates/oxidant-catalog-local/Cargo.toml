[package]
name = "oxidant-catalog-local"
description = "A filesystem/object-store catalog for Oxidant: config-declared tables over local or s3:// directories, with real write DDL."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
oxidant-catalog = { workspace = true }
async-trait = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# The manifest is written through `object_store`, not `std::fs`, so a local catalog whose
# warehouse is `s3://…` works exactly like one on disk. Pinned to the workspace's version.
object_store = { version = "=0.13.2", features = ["aws"] }
futures = "0.3.33"
url = "2.5.8"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3"
