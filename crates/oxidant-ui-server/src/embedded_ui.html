<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#111112" />
  <title>Oxidant</title>
  <!-- The mark, inlined as a data URI: this page is a single include_str! blob with no asset
       route behind it, so every brand element has to travel in the document itself. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Crect width='72' height='72' rx='16' fill='%230a0a0a'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='8' stroke-linecap='round'%3E%3Cpath d='M12 19.2 L12 36.8'/%3E%3Cpath d='M12 51.2 L12 64'/%3E%3Cpath d='M28 8 L28 20.8'/%3E%3Cpath d='M28 35.2 L28 52.8'/%3E%3Cpath d='M44 19.2 L44 36.8'/%3E%3Cpath d='M44 51.2 L44 64'/%3E%3Cpath d='M60 8 L60 20.8'/%3E%3Cpath d='M60 35.2 L60 52.8'/%3E%3Cpath d='M8 12 L20.8 12'/%3E%3Cpath d='M35.2 12 L52.8 12'/%3E%3Cpath d='M19.2 28 L36.8 28'/%3E%3Cpath d='M51.2 28 L64 28'/%3E%3Cpath d='M8 44 L20.8 44'/%3E%3Cpath d='M35.2 44 L52.8 44'/%3E%3Cpath d='M19.2 60 L36.8 60'/%3E%3Cpath d='M51.2 60 L64 60'/%3E%3C/g%3E%3C/svg%3E" />
  <script>
    // Dark is the default; apply a persisted light preference before paint to avoid a flash.
    // Same storage key as the React twin in `ui/`, so the two agree on a shared browser.
    (function () {
      try {
        if (localStorage.getItem('oxidant-theme') === 'light')
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <style>
    /*
     * Oxidant design tokens — dark-first monochrome. Kept in sync by hand with
     * `ui/src/styles/theme.css` (itself a copy of the website's src/styles/theme.css); same
     * variable names, same values. This file cannot @import it: it is compiled into the binary
     * with include_str! and must render on a driver with no egress and no asset pipeline.
     *
     * Two additions the marketing site does not define, because it renders nothing that can
     * fail or be in flight: `danger` (a failed job, a rejected statement) and the `*-line` /
     * `*-tint` pairs the state chips need. Both are semantic, never decorative.
     *
     * There is no decorative accent hue: emphasis is contrast and weight, and the "solid"
     * inverted slab is what a primary button gets instead of a fill. The only chromatic values
     * are semantic status.
     */
    :root {
      /* The UA's own widgets — a `<select>`'s dropdown, a `datetime-local`'s picker — take
         their surface from this, not from a token. Without it the log pane's date fields
         render a white sheet over a near-black page. */
      color-scheme: dark;

      /* Surfaces — layered near-blacks */
      --oxidant-bg: #111112;
      --oxidant-bg-subtle: #171719;
      --oxidant-surface: #171719;
      --oxidant-raised: #242428;
      --oxidant-border: rgba(255, 255, 255, 0.09);
      --oxidant-border-strong: rgba(255, 255, 255, 0.16);

      /* Text */
      --oxidant-text: #f5f5f5;
      --oxidant-text-secondary: #a3a3a3;
      --oxidant-text-muted: #737373;

      /* The inverted slab — monochrome's answer to an accent fill. */
      --oxidant-solid: #fafafa;
      --oxidant-solid-hover: #e5e5e5;
      --oxidant-on-solid: #111112;

      /* Semantic status only — never decorative. Tints and lines are explicit tokens, not
         alpha modifiers, so a chip reads the same in both themes. `danger` is an engine-only
         addition: the marketing site has no failed job to render. */
      --oxidant-success: #22c55e;
      --oxidant-success-tint: rgba(34, 197, 94, 0.12);
      --oxidant-success-line: rgba(34, 197, 94, 0.35);
      --oxidant-warning: #eab308;
      --oxidant-warning-tint: rgba(234, 179, 8, 0.12);
      --oxidant-warning-line: rgba(234, 179, 8, 0.35);
      --oxidant-danger: #ef4444;
      --oxidant-danger-tint: rgba(239, 68, 68, 0.12);
      --oxidant-danger-line: rgba(239, 68, 68, 0.35);

      /* Chart ramp — monochrome; magnitude bars take the brightest step. */
      --oxidant-chart-1: #fafafa;
      --oxidant-chart-2: #a3a3a3;
      --oxidant-chart-3: #737373;

      /* Code / terminal surface (dark in both themes — one step below the page) */
      --oxidant-code-bg: #0a0a0b;
      --oxidant-code-text: #e5e5e5;
      --oxidant-code-text-dim: #737373;

      /* Typography. The React twin bundles Geist as a woff2; a single-file page cannot, so
         this falls through to the system stack unless Geist is installed locally. */
      --oxidant-font-ui: Geist, Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      --oxidant-font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Shape */
      --oxidant-radius: 8px;
      --oxidant-radius-sm: 6px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --oxidant-bg: #ffffff;
      --oxidant-bg-subtle: #fafafa;
      --oxidant-surface: #ffffff;
      --oxidant-raised: #f5f5f5;
      --oxidant-border: #e5e5e5;
      --oxidant-border-strong: #d4d4d4;

      --oxidant-text: #0a0a0a;
      --oxidant-text-secondary: #525252;
      --oxidant-text-muted: #737373;

      --oxidant-solid: #0a0a0a;
      --oxidant-solid-hover: #262626;
      --oxidant-on-solid: #ffffff;

      --oxidant-danger: #dc2626;
      --oxidant-danger-tint: rgba(220, 38, 38, 0.1);
      --oxidant-danger-line: rgba(220, 38, 38, 0.35);

      --oxidant-chart-1: #0a0a0a;
      --oxidant-chart-2: #525252;
      --oxidant-chart-3: #737373;

      /* semantic status + the dark code surface stay identical across themes */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--oxidant-font-ui);
      background: var(--oxidant-bg);
      color: var(--oxidant-text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: var(--oxidant-solid); color: var(--oxidant-on-solid); }
    h1, h2, h3, h4 { letter-spacing: -0.02em; }

    /* ── Chrome ─────────────────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--oxidant-border);
      background: var(--oxidant-surface);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--oxidant-text); }
    .brand svg { height: 24px; width: 24px; }
    .brand span { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .rule { width: 1px; height: 16px; background: var(--oxidant-border-strong); }
    header .meta { color: var(--oxidant-text-muted); font-size: 13px; }
    #theme-toggle {
      margin-left: auto;
      height: 32px;
      width: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--oxidant-surface);
      border: 1px solid var(--oxidant-border);
      border-radius: var(--oxidant-radius-sm);
      color: var(--oxidant-text-muted);
      cursor: pointer;
      font-size: 14px;
      transition: color 0.15s, border-color 0.15s, background-color 0.15s;
    }
    #theme-toggle:hover {
      color: var(--oxidant-text);
      border-color: var(--oxidant-border-strong);
      background: var(--oxidant-raised);
    }
    nav {
      display: flex;
      gap: 4px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--oxidant-border);
      flex-wrap: wrap;
    }
    /* Active tab is weight + full contrast on a raised slab — never a hue. */
    nav button {
      background: transparent;
      border: none;
      color: var(--oxidant-text-muted);
      padding: 6px 12px;
      cursor: pointer;
      border-radius: var(--oxidant-radius-sm);
      font-size: 14px;
      font-family: inherit;
      transition: color 0.15s, background-color 0.15s;
    }
    nav button.active { background: var(--oxidant-raised); color: var(--oxidant-text); font-weight: 500; }
    nav button:hover { color: var(--oxidant-text); }
    main { padding: 20px; max-width: 1400px; margin: 0 auto; }

    /* ── Surfaces ───────────────────────────────────────────────────────────────────── */
    .card {
      background: var(--oxidant-surface);
      border: 1px solid var(--oxidant-border);
      border-radius: var(--oxidant-radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--oxidant-border); }
    th {
      color: var(--oxidant-text-muted);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    tr:hover td { background: var(--oxidant-bg-subtle); }

    /* ── Code / terminal surface ────────────────────────────────────────────────────── */
    pre.plan {
      font-family: var(--oxidant-font-mono);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      background: var(--oxidant-code-bg);
      color: var(--oxidant-code-text);
      padding: 12px;
      border-radius: var(--oxidant-radius-sm);
      max-height: 400px;
      overflow: auto;
    }

    /* ── Controls ───────────────────────────────────────────────────────────────────── */
    input[type=text], input[type=password], textarea {
      background: var(--oxidant-bg);
      border: 1px solid var(--oxidant-border);
      color: var(--oxidant-text);
      border-radius: var(--oxidant-radius-sm);
      padding: 8px 12px;
      font-size: 13px;
      width: 100%;
    }
    input[type=text], input[type=password] { max-width: 480px; }
    textarea { font-family: var(--oxidant-font-mono); resize: vertical; }
    input[type=text]:focus, input[type=password]:focus, textarea:focus { outline: none; border-color: var(--oxidant-border-strong); }
    label {
      display: block;
      font-size: 13px;
      color: var(--oxidant-text-muted);
      margin-bottom: 6px;
    }
    /* Small uppercase section label — muted, not colored. Mirrors .oxidant-eyebrow. */
    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--oxidant-text-muted);
    }
    /* The inverted slab — monochrome's primary action. */
    .btn {
      background: var(--oxidant-solid);
      color: var(--oxidant-on-solid);
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: var(--oxidant-radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: background-color 0.15s;
    }
    .btn:hover { background: var(--oxidant-solid-hover); }
    .btn-secondary {
      background: var(--oxidant-surface);
      border: 1px solid var(--oxidant-border);
      color: var(--oxidant-text);
      padding: 8px 16px;
      border-radius: var(--oxidant-radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--oxidant-border-strong); background: var(--oxidant-raised); }
    .btn[disabled], .btn-secondary[disabled] { opacity: 0.5; cursor: not-allowed; }

    /* ── Layout helpers ─────────────────────────────────────────────────────────────── */
    .editor-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
    /* Grid items floor at min-content, and a long SQL string in the history pane is wider than
       its column — without this the 1fr column steals space from the 2fr editor. */
    .editor-grid > * { min-width: 0; }
    @media (max-width: 900px) { .editor-grid { grid-template-columns: 1fr; } }
    .hidden { display: none; }
    .flex { display: flex; align-items: center; gap: 8px; }
    .bar { height: 8px; background: var(--oxidant-chart-1); border-radius: 999px; }
    .bar-wrap { background: var(--oxidant-raised); border-radius: 999px; height: 8px; flex: 1; }
    .note { color: var(--oxidant-text-muted); font-size: 12px; margin: 8px 0; }
    .muted { color: var(--oxidant-text-muted); }
    .result-wrap { overflow-x: auto; }

    /* ── Statement history ──────────────────────────────────────────────────────────── */
    .stmt-item {
      padding: 8px 10px;
      border-bottom: 1px solid var(--oxidant-border);
      cursor: pointer;
      font-size: 13px;
    }
    .stmt-item:hover { background: var(--oxidant-raised); }
    .stmt-sql {
      font-family: var(--oxidant-font-mono);
      font-size: 12px;
      color: var(--oxidant-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Notebook ───────────────────────────────────────────────────────────────────── */
    .nb-cell {
      background: var(--oxidant-surface);
      border: 1px solid var(--oxidant-border);
      border-radius: var(--oxidant-radius);
      padding: 12px;
      margin-bottom: 12px;
    }
    .nb-toolbar { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
    .nb-tag {
      border: 1px solid var(--oxidant-border);
      background: var(--oxidant-raised);
      border-radius: var(--oxidant-radius-sm);
      color: var(--oxidant-text-muted);
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .nb-btn {
      background: transparent;
      border: 1px solid var(--oxidant-border);
      color: var(--oxidant-text-muted);
      border-radius: var(--oxidant-radius-sm);
      padding: 2px 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .nb-btn:hover { color: var(--oxidant-text); border-color: var(--oxidant-border-strong); }
    .nb-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
    .nb-output { margin-top: 10px; overflow-x: auto; }

    /* ── Rendered Markdown cells ────────────────────────────────────────────────────── */
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 12px 0 6px; }
    .md p { margin: 6px 0; color: var(--oxidant-text-secondary); }
    .md code {
      font-family: var(--oxidant-font-mono);
      background: var(--oxidant-code-bg);
      color: var(--oxidant-code-text);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }
    .md pre {
      font-family: var(--oxidant-font-mono);
      font-size: 12px;
      background: var(--oxidant-code-bg);
      color: var(--oxidant-code-text);
      padding: 12px;
      border-radius: var(--oxidant-radius-sm);
      overflow: auto;
      margin: 8px 0;
      white-space: pre-wrap;
    }
    .md ul { padding-left: 20px; margin: 6px 0; }
    .md a {
      color: var(--oxidant-text);
      text-decoration: underline;
      text-decoration-color: var(--oxidant-border-strong);
      text-underline-offset: 4px;
    }

    /* ── Chips ──────────────────────────────────────────────────────────────────────────
     * The platform's state token: a dot plus mono text on a raised pill. The *dot* carries
     * the hue, so a column of chips reads as a column of words with a colour cue, not as a
     * row of coloured labels. Only `error` also tints the pill — a failure is allowed to be
     * louder than the states around it.
     */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--oxidant-border);
      background: var(--oxidant-raised);
      border-radius: 999px;
      padding: 2px 9px;
      font-family: var(--oxidant-font-mono);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--oxidant-text-secondary);
      white-space: nowrap;
    }
    .chip i { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--oxidant-text-muted); }
    .chip-ok i { background: var(--oxidant-success); }
    .chip-warn i { background: var(--oxidant-warning); }
    .chip-idle i { background: var(--oxidant-text-muted); }
    .chip-err { color: var(--oxidant-danger); border-color: var(--oxidant-danger-line); background: var(--oxidant-danger-tint); }
    .chip-err i { background: var(--oxidant-danger); }
    /* Running is the one state that moves: a slow pulse says "live" without a spinner. */
    .chip-run i { background: var(--oxidant-warning); animation: ox-pulse 1.8s ease-in-out infinite; }
    @keyframes ox-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .chip-run i { animation: none; } }

    /* ── Card header ────────────────────────────────────────────────────────────────────
     * Eyebrow over title, actions pushed right. Every card that is a *section* gets one, so
     * a page scans as a stack of labelled surfaces rather than a stack of tables.
     */
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .card-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .card-head .eyebrow { margin-bottom: 2px; }
    /* A card that is only a table reads better without the padding around it. */
    .card-flush { padding: 0; }
    .card-flush .card-head { padding: 16px 16px 12px; margin-bottom: 0; }
    .card-flush table th:first-child, .card-flush table td:first-child { padding-left: 16px; }
    .card-flush table th:last-child, .card-flush table td:last-child { padding-right: 16px; }
    .card-flush table tr:last-child td { border-bottom: none; }

    /* ── Empty state ────────────────────────────────────────────────────────────────────
     * A dashed hairline rather than a filled card: nothing is here *yet*, and the surface
     * should not claim otherwise.
     */
    .empty-state {
      border: 1px dashed var(--oxidant-border-strong);
      border-radius: var(--oxidant-radius);
      padding: 32px 20px;
      text-align: center;
      color: var(--oxidant-text-muted);
      font-size: 13px;
    }
    .empty-state strong { display: block; color: var(--oxidant-text-secondary); font-weight: 500; margin-bottom: 4px; }

    /* ── ErrorState ─────────────────────────────────────────────────────────────────────
     * Mirrors the platform console's ErrorState: a tinted, hairlined banner with a danger
     * eyebrow and the raw text on the terminal surface. Deliberately louder than a chip —
     * an error must not be a colour change in a table cell.
     */
    .error-state {
      border: 1px solid var(--oxidant-danger-line);
      background: var(--oxidant-danger-tint);
      border-radius: var(--oxidant-radius);
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .error-state .eyebrow { color: var(--oxidant-danger); }
    .error-state .error-title { font-size: 14px; font-weight: 600; margin: 4px 0 8px; letter-spacing: -0.01em; }
    .error-state pre {
      font-family: var(--oxidant-font-mono);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--oxidant-code-bg);
      color: var(--oxidant-code-text);
      border-radius: var(--oxidant-radius-sm);
      padding: 10px 12px;
      max-height: 220px;
      overflow: auto;
    }

    /* ── Metric tiles ───────────────────────────────────────────────────────────────────
     * Hairline-separated cells sharing one border, so a row of numbers is one object.
     */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1px;
      background: var(--oxidant-border);
      border: 1px solid var(--oxidant-border);
      border-radius: var(--oxidant-radius);
      overflow: hidden;
    }
    .metric { background: var(--oxidant-surface); padding: 12px 14px; }
    .metric .v {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Mono inline value — offsets, LSNs, ids. */
    .mono { font-family: var(--oxidant-font-mono); font-size: 12px; }
    /* Inline code in prose (env vars, endpoint paths). `.md code` overrides this inside a
       rendered Markdown cell, where the terminal surface is the right backdrop. */
    code {
      font-family: var(--oxidant-font-mono);
      font-size: 0.92em;
      background: var(--oxidant-raised);
      border: 1px solid var(--oxidant-border);
      border-radius: 4px;
      padding: 0 4px;
    }
    .num { font-variant-numeric: tabular-nums; }
    .truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr.selectable { cursor: pointer; }
    tr.selectable.selected td { background: var(--oxidant-raised); }

    /* Key/value rows — positions, config. Hairline between, label muted, value mono. */
    .kv { display: grid; grid-template-columns: minmax(120px, auto) 1fr; gap: 0; font-size: 12px; }
    .kv > div { padding: 7px 0; border-bottom: 1px solid var(--oxidant-border); min-width: 0; }
    .kv > div:nth-child(odd) { color: var(--oxidant-text-muted); padding-right: 12px; }
    .kv > div:nth-child(even) { font-family: var(--oxidant-font-mono); word-break: break-all; }
    .kv > div:nth-last-child(-n+2) { border-bottom: none; }

    /* ── Detail drawer ──────────────────────────────────────────────────────────────────
     * A right-hand sheet over a scrim. Same surfaces as a card; the only shadow in the page,
     * and it only exists while the sheet is open.
     */
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 40; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(620px, 100%);
      background: var(--oxidant-bg-subtle);
      border-left: 1px solid var(--oxidant-border);
      box-shadow: -16px 0 40px rgba(0, 0, 0, 0.35);
      z-index: 41;
      display: flex;
      flex-direction: column;
    }
    .drawer-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--oxidant-border);
      background: var(--oxidant-surface);
    }
    .drawer-head h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .drawer-body { padding: 16px 20px 32px; overflow: auto; flex: 1; }
    .drawer-body section { margin-bottom: 20px; }
    .drawer-body section > .eyebrow { display: block; margin-bottom: 8px; }
    .drawer-close {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--oxidant-border);
      color: var(--oxidant-text-muted);
      border-radius: var(--oxidant-radius-sm);
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      flex: none;
      transition: color 0.15s, border-color 0.15s;
    }
    .drawer-close:hover { color: var(--oxidant-text); border-color: var(--oxidant-border-strong); }

    /* Connector log tail — the terminal surface, one event per line. */
    .logline {
      display: flex;
      gap: 10px;
      padding: 5px 10px;
      border-bottom: 1px solid var(--oxidant-border);
      font-family: var(--oxidant-font-mono);
      font-size: 11.5px;
      line-height: 1.5;
    }
    .logline:last-child { border-bottom: none; }
    .logline .ts { color: var(--oxidant-code-text-dim); flex: none; }
    .logline .msg { color: var(--oxidant-code-text); word-break: break-word; min-width: 0; }
    .logline.lvl-error .msg { color: var(--oxidant-danger); }
    .logline.lvl-warn .msg { color: var(--oxidant-warning); }
    .logwrap {
      background: var(--oxidant-code-bg);
      border: 1px solid var(--oxidant-border);
      border-radius: var(--oxidant-radius-sm);
      max-height: 260px;
      overflow: auto;
    }
    /* The Observability pane is the page's subject, not a drawer aside, so it gets the room. */
    .logwrap.tall { max-height: 480px; }

    /* ── Filter chip ────────────────────────────────────────────────────────────────────
     * A chip that is also a control: same pill geometry as `.chip`, but *off* is a hairline
     * outline and *on* is the raised slab. The dot keeps the level's hue in both states (dimmed
     * when off), so the row reads as "these are the levels showing" rather than as four labels.
     */
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--oxidant-border);
      background: transparent;
      border-radius: 999px;
      padding: 2px 9px;
      cursor: pointer;
      font-family: var(--oxidant-font-mono);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--oxidant-text-muted);
      transition: color 0.15s, border-color 0.15s, background-color 0.15s;
    }
    .filter-chip:hover { color: var(--oxidant-text); border-color: var(--oxidant-border-strong); }
    .filter-chip.on { background: var(--oxidant-raised); color: var(--oxidant-text-secondary); }
    .filter-chip i { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--oxidant-text-muted); opacity: 0.3; }
    .filter-chip.on i { opacity: 1; }
    .filter-chip.lvl-error i { background: var(--oxidant-danger); }
    .filter-chip.lvl-warn i { background: var(--oxidant-warning); }
    .filter-chip.lvl-info i { background: var(--oxidant-text-secondary); }
    .filter-chip.lvl-debug i { background: var(--oxidant-text-muted); }

    /* ── Log pane controls ──────────────────────────────────────────────────────────────
     * A row of labelled fields over the terminal surface, not a toolbar of icons: each control
     * is a filter with a name, and the name is what an operator types into `curl` when they want
     * the same thing without a browser. Eyebrow over field, same as a card head, so the row reads
     * as part of the surface rather than bolted above it.
     */
    .log-controls {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .log-control { display: flex; flex-direction: column; gap: 4px; margin: 0; min-width: 0; }
    .log-control.grow { flex: 1 1 220px; }
    .log-control .eyebrow { margin: 0; }
    .log-control input, .log-control select {
      background: var(--oxidant-bg);
      border: 1px solid var(--oxidant-border);
      color: var(--oxidant-text);
      border-radius: var(--oxidant-radius-sm);
      padding: 6px 10px;
      font-size: 12px;
      font-family: var(--oxidant-font-mono);
      max-width: none;
      min-width: 0;
    }
    .log-control select { cursor: pointer; }
    .log-control input:focus, .log-control select:focus {
      outline: none;
      border-color: var(--oxidant-border-strong);
    }
    /* A `datetime-local` with nothing in it is the *unbounded* end of the range, and it must
       look it: the UA paints its `yyyy-mm-dd --:--` skeleton at full text colour, which reads
       as a value that is set. The class is toggled from JS — `:invalid` does not match an
       empty optional field, and `:placeholder-shown` does not apply to date inputs. */
    .log-control input.empty { color: var(--oxidant-text-muted); }
    /* The follow switch sits with the level chips: both answer "what am I watching", and both
       are controls that look like the state they set. */
    .log-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0 0 0 auto;
      font-size: 12px;
      color: var(--oxidant-text-secondary);
      cursor: pointer;
      white-space: nowrap;
    }
    .log-toggle input { accent-color: var(--oxidant-solid); cursor: pointer; }
    .log-toggle input[disabled] { cursor: not-allowed; }
    #obs-dump-note a { color: var(--oxidant-text); text-decoration: underline; text-underline-offset: 3px; }

    /* ── Inline sub-rows ────────────────────────────────────────────────────────────────
     * A job's stages, under the job. One step down in surface and indented, so the nesting is
     * legible without a second card around it.
     */
    .caret { display: inline-block; width: 10px; color: var(--oxidant-text-muted); transition: transform 0.12s; }
    tr.expanded .caret { transform: rotate(90deg); }
    tr.substages > td { background: var(--oxidant-bg-subtle); padding: 0 0 0 26px; }
    tr.substages th { font-size: 10px; }
    tr.substages table tr:last-child td { border-bottom: none; }
    tr.substages .none { padding: 10px 0; color: var(--oxidant-text-muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <!-- The Oxidant mark: a plain-weave grid, warp over weft. Stroked with currentColor so one
         copy serves both themes. Geometry matches ui/src/components/Logo.tsx. -->
    <div class="brand">
      <svg viewBox="0 0 72 72" role="img" aria-label="Oxidant">
        <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"><path d="M12 19.2 L12 36.8"/><path d="M12 51.2 L12 64"/><path d="M28 8 L28 20.8"/><path d="M28 35.2 L28 52.8"/><path d="M44 19.2 L44 36.8"/><path d="M44 51.2 L44 64"/><path d="M60 8 L60 20.8"/><path d="M60 35.2 L60 52.8"/><path d="M8 12 L20.8 12"/><path d="M35.2 12 L52.8 12"/><path d="M19.2 28 L36.8 28"/><path d="M51.2 28 L64 28"/><path d="M8 44 L20.8 44"/><path d="M35.2 44 L52.8 44"/><path d="M19.2 60 L36.8 60"/><path d="M51.2 60 L64 60"/></g>
      </svg>
      <span>Oxidant</span>
    </div>
    <span class="rule"></span>
    <span class="meta" id="app-meta">Loading…</span>
    <button id="theme-toggle" type="button" aria-label="Toggle theme" title="Switch theme">☀</button>
  </header>
  <nav id="tabs">
    <button data-tab="jobs" class="active">Jobs</button>
    <button data-tab="stages">Stages</button>
    <button data-tab="sql">SQL</button>
    <button data-tab="pipelines">Pipelines</button>
    <button data-tab="editor">Editor</button>
    <button data-tab="notebook">Notebook</button>
    <button data-tab="executors">Executors</button>
    <button data-tab="environment">Environment</button>
    <button data-tab="observability">Observability</button>
  </nav>
  <main>
    <section id="panel-jobs" class="panel"></section>
    <section id="panel-stages" class="panel hidden"></section>
    <section id="panel-sql" class="panel hidden"></section>
    <section id="panel-pipelines" class="panel hidden"></section>
    <section id="panel-editor" class="panel hidden"></section>
    <section id="panel-notebook" class="panel hidden"></section>
    <section id="panel-executors" class="panel hidden"></section>
    <section id="panel-environment" class="panel hidden"></section>
    <section id="panel-observability" class="panel hidden"></section>
  </main>
  <!-- Pipeline detail sheet. Empty until a row is clicked; it covers the page, so it sits
       outside <main> rather than inside the panel that owns it. -->
  <div id="pipe-drawer"></div>
  <script>
    const APP_ID = 'oxidant-local';
    const api = (path) => fetch('/api/v1/applications/' + APP_ID + path).then(r => r.json());
    const fmt = (n) => n == null ? '—' : (typeof n === 'number' ? n.toLocaleString() : n);
    const fmtMs = (ms) => ms == null ? '—' : (ms < 1000 ? ms + ' ms' : (ms/1000).toFixed(2) + ' s');
    // Binary units, because every byte count on this page came from a buffer or a WAL segment.
    const fmtBytes = (n) => {
      if (n == null || !Number.isFinite(Number(n))) return '—';
      let v = Number(n);
      const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
      let i = 0;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)) + ' ' + units[i];
    };
    const dur = (start, end) => {
      if (!start || !end) return '—';
      const s = new Date(start).getTime(), e = new Date(end).getTime();
      return fmtMs(e - s);
    };
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    /* ---------- Design-system primitives ----------
     * The platform console's component vocabulary, as functions: every state in this page is a
     * chip, every failure is an ErrorState, every "nothing here" is an EmptyState. Rendering a
     * state any other way (a coloured <td>, a bare sentence in a card) is how the two consoles
     * drifted apart in the first place.
     */

    // Lifecycle words the engine actually emits, mapped onto the four chip tones. Spark's
    // job/stage statuses are SHOUTED, the REST statement API's are lowercase, and the
    // pipeline states below are our own — all three land here.
    const CHIP_TONE = {
      succeeded: 'ok', success: 'ok', complete: 'ok', completed: 'ok', finished: 'ok', committed: 'ok',
      running: 'run', active: 'run', live: 'run',
      pending: 'warn', queued: 'warn', starting: 'warn', idle: 'idle', unknown: 'idle', canceled: 'idle', cancelled: 'idle', skipped: 'idle',
      failed: 'err', error: 'err', fail: 'err', dead: 'err',
    };

    // `chip('RUNNING')` → a dot + the word. Pass `label` to show something other than the
    // state itself (e.g. a batch id next to its state).
    function chip(state, label) {
      const word = String(state == null ? 'unknown' : state).split(' ')[0];
      const tone = CHIP_TONE[word.toLowerCase()] || 'idle';
      return `<span class="chip chip-${tone}"><i></i>${esc(label != null ? label : word)}</span>`;
    }

    function emptyState(title, hint) {
      return `<div class="empty-state"><strong>${esc(title)}</strong>${hint ? esc(hint) : ''}</div>`;
    }

    // Louder than a chip, deliberately: title + the raw text on the terminal surface.
    function errorState(title, detail) {
      return `<div class="error-state">
        <div class="eyebrow">Error</div>
        <div class="error-title">${esc(title)}</div>
        ${detail ? `<pre>${esc(detail)}</pre>` : ''}
      </div>`;
    }

    // Eyebrow + title, with optional right-aligned actions. Every section card gets one.
    function cardHead(eyebrow, title, actions) {
      return `<div class="card-head">
        <div><div class="eyebrow">${esc(eyebrow)}</div><div class="card-title">${esc(title)}</div></div>
        ${actions ? `<div class="flex">${actions}</div>` : ''}
      </div>`;
    }

    let state = { jobs: [], stages: [], sql: [], executors: [], env: {} };

    // Dark-first with a persisted light opt-in, mirroring ui/src/lib/theme.ts. The pre-paint
    // script in <head> has already applied the stored preference; this only wires the control.
    const themeBtn = document.getElementById('theme-toggle');
    const isLight = () => document.documentElement.getAttribute('data-theme') === 'light';
    const paintThemeBtn = () => {
      themeBtn.textContent = isLight() ? '\u263E' : '\u2600';
      themeBtn.title = isLight() ? 'Switch to dark' : 'Switch to light';
    };
    paintThemeBtn();
    themeBtn.addEventListener('click', () => {
      const next = isLight() ? 'dark' : 'light';
      if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('oxidant-theme', next); } catch (e) {}
      paintThemeBtn();
    });


    document.getElementById('tabs').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
      document.getElementById('panel-' + e.target.dataset.tab).classList.remove('hidden');
      const tab = e.target.dataset.tab;
      // Pipelines and Observability each own a poll of their own — the token-guarded
      // /api/v1/pipelines* routes and /api/v1/logs. Each runs only while its page is on screen.
      if (tab === 'pipelines') openPipelines();
      else stopPipelines();
      if (tab === 'observability') openObservability();
      else stopObservability();
    });

    async function refresh() {
      try {
        const [app, jobs, stages, sql, executors, env] = await Promise.all([
          fetch('/api/v1/applications').then(r => r.json()),
          api('/jobs'),
          api('/stages?details=true'),
          api('/sql'),
          api('/executors'),
          api('/environment'),
        ]);
        const a = app[0] || {};
        document.getElementById('app-meta').textContent =
          (a.name || 'Oxidant') + ' · ' + (a.attempts?.[0]?.sparkUser || 'oxidant') + ' · jobs: ' + jobs.length;
        state = { jobs, stages, sql, executors, env };
        renderJobs(); renderStages(); renderSql(); renderExecutors(); renderEnvironment();
        // Observability's jobs/stages/SQL sections are exactly this data, so they repaint with
        // it and need no poll of their own; only its log pane does. Pipelines is NOT here: no
        // streaming work reaches these surfaces, and it reads the connector logs on its own
        // timer — see the Pipelines block below.
        paintObservability();
      } catch (e) { console.error(e); }
    }

    function renderJobs() {
      const el = document.getElementById('panel-jobs');
      if (!state.jobs.length) {
        el.innerHTML = emptyState('No jobs yet', 'Run a query from the Editor, or connect a PySpark client.');
        return;
      }
      el.innerHTML = '<div class="card card-flush">' +
        cardHead('Execution', 'Jobs', `<span class="note" style="margin:0">${state.jobs.length} total</span>`) +
        '<table><thead><tr><th>Job</th><th>Description</th><th>Submitted</th><th>Duration</th><th>Stages</th><th>Status</th></tr></thead><tbody>' +
        state.jobs.map(j => `<tr>
          <td class="num">${j.jobId}</td>
          <td class="truncate" title="${esc(j.description || '')}">${esc(j.name || j.description || '—')}</td>
          <td class="mono">${esc(j.submissionTime || '—')}</td>
          <td class="num">${dur(j.submissionTime, j.completionTime)}</td>
          <td class="mono">${(j.stageIds||[]).join(', ') || '—'}</td>
          <td>${chip(j.status)}</td>
        </tr>`).join('') + '</tbody></table></div>';
    }

    function renderStages() {
      const el = document.getElementById('panel-stages');
      if (!state.stages.length) {
        el.innerHTML = emptyState('No stages yet', 'Stages appear as soon as a job starts executing.');
        return;
      }
      const maxDur = Math.max(...state.stages.map(s => s.executorRunTime || 0), 1);
      el.innerHTML = '<div class="card card-flush">' +
        cardHead('Execution', 'Stages', `<span class="note" style="margin:0">${state.stages.length} total</span>`) +
        '<table><thead><tr><th>Stage</th><th>Description</th><th>Duration</th><th>Tasks</th><th>Shuffle read</th><th>Shuffle write</th><th>Status</th></tr></thead><tbody>' +
        state.stages.map(s => `<tr>
          <td class="num">${s.stageId}</td>
          <td class="truncate" title="${esc(s.name || s.description || '')}">${esc(s.name || s.description || '—')}</td>
          <td><div class="flex"><span class="num">${fmtMs(s.executorRunTime)}</span><div class="bar-wrap"><div class="bar" style="width:${((s.executorRunTime||0)/maxDur*100).toFixed(0)}%"></div></div></div></td>
          <td class="num">${s.numCompleteTasks}/${s.numTasks}</td>
          <td class="num">${fmtBytes(s.shuffleReadBytes)}</td>
          <td class="num">${fmtBytes(s.shuffleWriteBytes)}</td>
          <td>${chip(s.status)}</td>
        </tr>`).join('') + '</tbody></table></div>';
    }

    function renderSql() {
      const el = document.getElementById('panel-sql');
      if (!state.sql.length) {
        el.innerHTML = emptyState('No SQL executions yet', 'Every SQL or DataFrame execution lands here with its physical plan.');
        return;
      }
      el.innerHTML = state.sql.map(s => `<div class="card">
        ${cardHead('Execution ' + s.id, s.description || 'SQL', chip(s.status) + `<span class="note" style="margin:0">${fmtMs(s.duration)}</span>`)}
        <pre class="plan">${esc(s.physicalPlan || '')}</pre>
      </div>`).join('');
    }

    // The label says whether the executor is *registered*; the tone says whether it is
    // *working*. `run` is the one tone that pulses, and a registered-but-idle worker pulsing
    // forever reads as a cluster busy with nothing.
    function renderExecutors() {
      const el = document.getElementById('panel-executors');
      if (!state.executors.length) {
        el.innerHTML = emptyState('No executors registered', 'Single-node mode. Attach workers to run distributed.');
        return;
      }
      el.innerHTML = '<div class="card card-flush">' +
        cardHead('Cluster', 'Executors') +
        '<table><thead><tr><th>ID</th><th>Host</th><th>State</th><th>Active</th><th>Completed</th><th>Shuffle read</th><th>Shuffle write</th></tr></thead><tbody>' +
        state.executors.map(e => `<tr>
          <td class="mono">${esc(e.id)}</td><td class="mono">${esc(e.hostPort)}</td>
          <td>${chip(e.isActive === false ? 'dead' : (e.activeTasks > 0 ? 'running' : 'idle'), e.isActive === false ? 'inactive' : 'active')}</td>
          <td class="num">${fmt(e.activeTasks)}</td><td class="num">${fmt(e.completedTasks)}</td>
          <td class="num">${fmtBytes(e.totalShuffleRead)}</td><td class="num">${fmtBytes(e.totalShuffleWrite)}</td>
        </tr>`).join('') + '</tbody></table></div>';
    }

    function renderEnvironment() {
      const el = document.getElementById('panel-environment');
      const props = state.env.sparkProperties || {};
      const keys = Object.keys(props).sort();
      if (!keys.length) { el.innerHTML = emptyState('No properties reported'); return; }
      el.innerHTML = '<div class="card card-flush">' +
        cardHead('Runtime', 'Environment', `<span class="note" style="margin:0">${keys.length} properties</span>`) +
        '<table><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>' +
        keys.map(k => `<tr><td>${esc(k)}</td><td class="mono">${esc(props[k])}</td></tr>`).join('') +
        '</tbody></table></div>';
    }

    /* ---------- Observability: server logs, jobs & stages, SQL executions ----------
     *
     * One screen for "what is this driver actually doing", built only on surfaces the engine
     * already serves:
     *
     *   /api/v1/logs                      the driver's in-memory log ring buffer (the last
     *                                     1000 lines, oldest first), behind the same bearer
     *                                     token as the Pipelines page. It is served by the
     *                                     engine's REST router, so it is absent on the
     *                                     standalone history server — the pane says so rather
     *                                     than showing an empty box.
     *   /api/v1/applications/{app}/jobs   + /stages: one row per job, expanding into the
     *                                     stages it ran.
     *   /api/v1/applications/{app}/sql    every execution the observability store holds —
     *                                     Spark Connect, the REST statement API, the Editor.
     *
     * Only the log tail needs a poll of its own (5 s, and only while this page is on screen).
     * Jobs, stages and SQL already ride refresh() and the SSE stream; fetching them a second
     * time would double the load and buy no freshness.
     *
     * One derived number, labelled where it appears: an execution's row count. The store
     * records a plan, a status and a duration for an execution but not its cardinality, so
     * rows are summed over the stages its jobs actually ran.
     */
    const OBS_POLL_MS = 5000;
    /* Severity floor, loudest first — the same order and the same words the API's `level=`
       takes, so a chip and a curl mean one thing. */
    const OBS_LEVELS = ['error', 'warn', 'info', 'debug'];
    /* Lines a page asks for. The API clamps at 10,000; this is what one screenful of scrollback
       costs, and `next_before` fetches the page before it when the reader scrolls up. */
    const OBS_PAGE = 500;

    const obsState = {
      timer: null,
      paused: false,
      // A *floor*, not a set: `warn` is "warn and error". The API evaluates it, so the pane and
      // a `curl` cannot disagree about what `level=warn` means.
      level: null,       // null = every level
      target: '',
      q: '',
      from: '',          // `<input type=datetime-local>` local wall clock; '' = unbounded
      to: '',            // exclusive upper bound, so two adjacent ranges tile without overlap
      file: 'current',   // the `?file=` value, or 'ring' for the in-memory buffer
      // A node with `OXIDANT_LOG_ROLL=off` has no `current` file but still has the ring, and
      // saying "no logs here" about a node that is logging is the kind of lie §6b exists to
      // prevent. Two flags, because they answer two different questions: `currentMissing` is a
      // fact about the node — it survives an explicit pick, so asking for `current` again gets
      // the honest `404` rather than being redirected a second time — and `ringFallback` is
      // *why the ring is on screen*, which only the caption cares about.
      currentMissing: false,
      ringFallback: false,
      worker: 'driver',
      follow: true,      // tail-follow, over SSE
      files: null,       // [{file, rolled, format, size_bytes, first_ts, last_ts}] for the picker
      workers: null,     // [{worker_id, reachable, error}] for the worker picker
      page: null,        // { code, lines, error, next_before, dedup, format }
      older: [],         // pages the reader scrolled back into, oldest-first
      at: null,
      tail: null,        // the EventSource, while following
      tailMode: null,    // 'follow' (driver, live) or 'poll' (worker, 2 s)
      tailError: null,   // the last thing a worker poll said when it failed mid-follow
      dropped: 0,        // lines the SSE fan-out told us we fell behind by
      expanded: {},      // jobId -> true, for the inline stage rows
    };

    // Same credential the Pipelines page stores, and every log route needs it: the files carry
    // every tracing field the node logged, so they are gated by the same OXIDANT_STATUS_TOKEN as
    // /api/status and the connector logs. Without one this pane says so rather than showing an
    // empty box.
    const obsAuthHeaders = () => pipeState.token ? { Authorization: 'Bearer ' + pipeState.token } : {};

    /* `2026-08-23T14:00:00.500Z [INFO] oxidant_connect - message=…` → `info`.
     *
     * **`[LEVEL]` is no longer line-initial.** PR3 put an RFC-3339 UTC timestamp in front of it
     * so the rolled Parquet would have a `ts` column to filter on, and this regex still anchored
     * at `^` — so it matched nothing, every line came back with a null level, and the filter
     * chips this page has always drawn could not hide a single line. That is the `docs/web-ui.md`
     * drift PR4 reconciles: the chips were drawn and documented, and they did nothing.
     *
     * They now drive the API's `level=` as well, so the filtering happens over the whole file
     * rather than over the page that was already fetched. This regex is what *colours* a line. */
    function obsLevelOf(line) {
      const m = /\[(ERROR|WARN|INFO|DEBUG|TRACE)\]/.exec(String(line || ''));
      if (!m) return null;
      const lvl = m[1].toLowerCase();
      return lvl === 'trace' ? 'debug' : lvl;
    }

    // The query string every log route takes. Built once so the pane, the tail and the dump
    // cannot drift on what "the current filter" means.
    function obsQuery(extra) {
      const p = new URLSearchParams();
      if (obsState.worker && obsState.worker !== 'driver') p.set('worker', obsState.worker);
      if (obsState.file && obsState.file !== 'ring') p.set('file', obsState.file);
      if (obsState.level) p.set('level', obsState.level);
      if (obsState.target.trim()) p.set('target', obsState.target.trim());
      if (obsState.q.trim()) p.set('q', obsState.q.trim());
      // The API takes RFC-3339 instants; the control speaks the reader's own wall clock. The
      // conversion happens here, once, so the pane and a `curl` mean the same window.
      const from = obsInstant(obsState.from), to = obsInstant(obsState.to);
      if (from) p.set('from', from);
      if (to) p.set('to', to);
      for (const [k, v] of Object.entries(extra || {})) if (v != null) p.set(k, v);
      return p.toString();
    }

    // `2026-08-24T14:00` (local) → `2026-08-24T12:00:00.000Z`. An unparseable value is dropped
    // rather than sent: a `400` on every keystroke of a half-typed date is not a filter.
    function obsInstant(local) {
      if (!local) return null;
      const t = new Date(local);
      return isNaN(t.getTime()) ? null : t.toISOString();
    }

    async function obsFetch(path) {
      const r = await fetch(path, { headers: obsAuthHeaders() });
      const body = await r.json().catch(() => ({}));
      return { code: r.status, body };
    }

    // The file picker and the worker picker. Refreshed when the pane opens and when the worker
    // changes — a rolled file appears at most once a period, and the picker is not a live view.
    async function fetchObsPickers() {
      try {
        const { code, body } = await obsFetch('/api/v1/logs/workers');
        obsState.workers = code === 200 ? (body.workers || []) : [];
      } catch (e) { obsState.workers = []; }
      try {
        const { code, body } = await obsFetch('/api/v1/logs/files?' + obsQuery({}));
        obsState.files = code === 200 ? (body.files || []) : [];
      } catch (e) { obsState.files = []; }
    }

    // One page, newest-last. `older` is reset: changing a filter starts a new walk.
    async function fetchObsLogs() {
      if (obsState.paused) return;
      const path = '/api/v1/logs?' + obsQuery({ limit: OBS_PAGE, order: 'desc' });
      try {
        const { code, body } = await obsFetch(path);
        // **`current` is a file, and a node can be logging without having one.**
        // `OXIDANT_LOG_ROLL=off` keeps durable statement history with stderr-only logs, and
        // then every `?file=` is a `404` — while `/api/v1/logs` with no `?file=`, the memory
        // ring this pane read before PR4, still answers. Drop to it once and let the caption
        // say which one is on screen, rather than reporting "no logs" about a live node.
        if (code === 404 && obsState.file === 'current' && !obsState.currentMissing) {
          obsState.currentMissing = true;
          obsState.ringFallback = true;
          obsState.file = 'ring';
          return fetchObsLogs();
        }
        obsState.page = code === 200
          ? {
              code,
              lines: Array.isArray(body.logs) ? body.logs : [],
              next_before: body.next_before == null ? null : body.next_before,
              dedup: !!body.dedup,
              format: body.format || null,
            }
          : { code, lines: [], error: body.error };
        obsState.older = [];
      } catch (e) {
        obsState.page = { code: 0, lines: [], error: e.message };
      }
      obsState.at = Date.now();
    }

    // The page *before* the oldest one on screen. The cursor is the API's, so the reader walks
    // backward through a 256 MiB day without ever loading it.
    async function fetchObsOlder() {
      const oldest = obsState.older.length ? obsState.older[0] : obsState.page;
      if (!oldest || oldest.next_before == null) return;
      const path = '/api/v1/logs?' + obsQuery({
        limit: OBS_PAGE, order: 'desc', before: oldest.next_before,
      });
      const { code, body } = await obsFetch(path);
      if (code !== 200) return;
      obsState.older.unshift({
        code, lines: Array.isArray(body.logs) ? body.logs : [],
        next_before: body.next_before == null ? null : body.next_before,
      });
      paintObservability();
    }

    /* ---- Tail-follow (SSE) ----
     * The driver's tail is the `tracing` stream itself; a worker's is honestly a 2 s poll, and
     * the stream's `open` event says which. Both append to the page on screen, so following and
     * paging are the same view rather than two.
     */
    function startObsTail() {
      stopObsTail();
      if (!obsState.follow || obsState.paused) return;
      /* **`fetch` + a `ReadableStream`, not `EventSource`.** `EventSource` cannot carry an
       * `Authorization` header, and the only ways around that are a token in the query string —
       * which lands in proxy logs, browser history and `Referer` — or a cookie, which is a new
       * auth surface on a router served under a permissive CORS layer. Reading the SSE stream by
       * hand costs the twenty lines below and keeps exactly one credential path for every log
       * route: the same bearer header the pages use. */
      const ctl = new AbortController();
      obsState.tail = ctl;
      const gen = ++obsTailGeneration;
      const qs = obsQuery({});
      fetch('/api/v1/logs/tail?' + qs, { headers: obsAuthHeaders(), signal: ctl.signal })
        .then(async (r) => {
          if (!r.ok || !r.body) return;
          const reader = r.body.getReader();
          const dec = new TextDecoder();
          let buf = '';
          for (;;) {
            const { value, done } = await reader.read();
            // A stale generation: a filter changed and this stream is answering the old query.
            if (done || gen !== obsTailGeneration) return;
            buf += dec.decode(value, { stream: true });
            // SSE frames are separated by a blank line; a partial frame stays in the buffer.
            let cut;
            while ((cut = buf.indexOf('\n\n')) >= 0) {
              obsTailFrame(buf.slice(0, cut));
              buf = buf.slice(cut + 2);
            }
          }
        })
        .catch(() => { /* aborted, or the stream dropped: the 5 s poll is the fallback */ });
    }

    // Bumped on every (re)start, so a stream still draining under the old filter is discarded
    // rather than appending lines the reader did not ask for.
    let obsTailGeneration = 0;

    function obsTailFrame(frame) {
      let event = 'message';
      const data = [];
      for (const line of frame.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
        // `:` is an SSE comment (a keep-alive); everything else is a field we do not use.
      }
      const payload = data.join('\n');
      if (event === 'line') { obsAppend([payload]); return; }
      if (event === 'lines') {
        try { obsAppend(JSON.parse(payload) || []); } catch (e) {}
        return;
      }
      if (event === 'open') {
        // The mode, so the caption says `live` or `polled` rather than implying a 2 s feed is
        // live.
        try { obsState.tailMode = (JSON.parse(payload) || {}).mode || null; } catch (e) {}
        paintObservability();
        return;
      }
      if (event === 'dropped') {
        // **The gap is never silent.** The fan-out tells a slow reader exactly how many lines it
        // lost, and the caption carries the count rather than letting a jump go unexplained.
        try { obsState.dropped += (JSON.parse(payload) || {}).dropped || 0; } catch (e) {}
        paintObservability();
        return;
      }
      if (event === 'rolled') {
        // The followed node rolled its live file: the picker and the page are both stale.
        fetchObsPickers().then(fetchObsLogs).then(paintObservability);
        return;
      }
      if (event === 'error') {
        // A worker poll failed mid-follow. The stream stays open — a worker restart is exactly
        // when someone is watching — and the failure is said out loud.
        try {
          const d = JSON.parse(payload) || {};
          obsState.tailError = d.error || null;
        } catch (e) {}
        paintObservability();
      }
    }

    function stopObsTail() {
      obsTailGeneration++;
      if (obsState.tail) { try { obsState.tail.abort(); } catch (e) {} obsState.tail = null; }
      obsState.tailMode = null;
      obsState.tailError = null;
    }

    function obsAppend(lines) {
      if (!lines.length || !obsState.page) return;
      obsState.page.lines = obsState.page.lines.concat(lines).slice(-OBS_PAGE * 2);
      paintObservability();
    }

    // Every line on screen, oldest first: the pages the reader scrolled back into, then the one
    // the poll or the tail owns.
    function obsLines() {
      const out = [];
      for (const p of obsState.older) out.push(...p.lines);
      if (obsState.page) out.push(...obsState.page.lines);
      return out;
    }

    function obsLogsSectionHtml() {
      const page = obsState.page;
      if (!page) return '<div class="note" style="margin:0">Loading&hellip;</div>';
      if (page.code === 404) {
        return emptyState('No logs to read here',
          'The log routes answer 404 when OXIDANT_STATUS_TOKEN is unset on the driver — they are gated like /api/status, because the files carry every logged field — and on a node with no rolling writer (OXIDANT_LOG_ROLL=off, or OXIDANT_HISTORY=off). ' + (page.error || ''));
      }
      if (page.code === 401 || page.code === 403) {
        return emptyState('The log API needs a credential',
          'Set the driver status token on the Pipelines page; this page sends the same one.');
      }
      if (page.code === 502 || page.code === 504) {
        return errorState('That worker did not answer',
          (page.error || '') + '\n\nIts rows are absent because it could not be reached — not because it logged nothing. Pick another node, or check the worker.');
      }
      if (page.code !== 200) {
        return errorState('Could not read the log', (page.error ? page.error + '\n\n' : '') + 'The log API answered ' + page.code + '.');
      }
      const lines = obsLines();
      const more = (obsState.older.length ? obsState.older[0] : page).next_before != null;
      const head = more
        ? '<button class="nb-btn" id="obs-older" style="width:100%;border-radius:0;border:none;border-bottom:1px solid var(--oxidant-border);padding:6px">Load older lines</button>'
        : '<div class="logline"><span class="msg" style="color:var(--oxidant-code-text-dim)">— start of ' + esc(obsState.file === 'ring' ? 'the buffer' : obsState.file) + ' —</span></div>';
      const body = lines.length
        ? lines.map(l => {
            const lvl = obsLevelOf(l);
            const cls = lvl === 'error' ? 'lvl-error' : (lvl === 'warn' ? 'lvl-warn' : '');
            return `<div class="logline ${cls}"><span class="msg">${esc(l)}</span></div>`;
          }).join('')
        : '<div class="logline"><span class="msg">(no lines match these filters)</span></div>';
      return `<div class="logwrap tall" id="obs-logwrap">${head}${body}</div>`;
    }

    function obsLogsCaptionHtml() {
      const page = obsState.page;
      if (!page || page.code !== 200) return '';
      const bits = [obsState.worker === 'driver' ? 'driver' : 'worker ' + obsState.worker];
      bits.push(obsState.file === 'ring'
        // Why the ring: because the reader chose it, or because this node has no rolled files
        // to choose. The second is a fact about the node and belongs on screen.
        ? 'memory ring' + (obsState.ringFallback ? ' (this node writes no rolled files)' : '')
        : obsState.file + (page.format ? ' · ' + page.format : ''));
      bits.push(obsLines().length.toLocaleString() + ' line' + (obsLines().length === 1 ? '' : 's'));
      // `dedup` is the file's own answer: an identical consecutive line was collapsed into
      // `… repeated N times`, so a run on screen is shorter than the run that happened. The
      // memory ring and the SSE tail are never deduped, and say so — the file is authoritative.
      bits.push(page.dedup ? 'deduped' : 'not deduped');
      if (obsState.paused) bits.push('paused');
      else if (obsState.follow && obsState.tailMode === 'follow') bits.push('following live');
      else if (obsState.follow && obsState.tailMode === 'poll') bits.push('following · polled every 2 s');
      else bits.push('refreshing every ' + (OBS_POLL_MS / 1000) + ' s');
      if (obsState.dropped) bits.push(obsState.dropped.toLocaleString() + ' lines dropped by the tail');
      if (obsState.tailError) bits.push('follow error: ' + obsState.tailError);
      return bits.join(' · ');
    }

    // An execution's row count, summed over the stages its jobs ran. Prefer what reached the
    // sink; an execution that wrote nothing still read something, and reading zero is a fact.
    function execRows(exec, jobById, stageById) {
      let out = 0, inn = 0, seen = false;
      for (const jid of exec.jobIds || []) {
        const job = jobById.get(jid);
        for (const sid of (job && job.stageIds) || []) {
          const st = stageById.get(sid);
          if (!st) continue;
          seen = true;
          out += st.outputRecords || 0;
          inn += st.inputRecords || 0;
        }
      }
      return seen ? (out || inn) : null;
    }

    function obsJobsSectionHtml() {
      if (!state.jobs.length) {
        return emptyState('No jobs yet',
          'A job appears for every action the engine runs — a query from the Editor, a PySpark client, a dashboard widget refresh.');
      }
      const stageById = new Map(state.stages.map(st => [st.stageId, st]));
      const rows = state.jobs.map(j => {
        const ids = j.stageIds || [];
        const open = !!obsState.expanded[j.jobId];
        const done = j.numCompletedStages != null ? j.numCompletedStages
          : ids.filter(id => /succeed|complete/i.test((stageById.get(id) || {}).status || '')).length;
        const head = `<tr class="selectable ${open ? 'expanded' : ''}" data-job="${j.jobId}">
          <td class="num"><span class="caret">▸</span> ${j.jobId}</td>
          <td class="truncate" title="${esc(j.description || j.name || '')}">${esc(j.name || j.description || '—')}</td>
          <td>${chip(j.status)}</td>
          <td class="num">${dur(j.submissionTime, j.completionTime)}</td>
          <td class="num">${done}/${ids.length}</td>
        </tr>`;
        if (!open) return head;
        const stages = ids.map(id => stageById.get(id)).filter(Boolean);
        const inner = stages.length
          ? `<table><thead><tr><th>Stage</th><th>Name</th><th>Status</th><th>Duration</th><th>Shuffle read</th><th>Shuffle write</th></tr></thead><tbody>` +
            stages.map(st => `<tr>
              <td class="num">${st.stageId}</td>
              <td class="truncate" title="${esc(st.name || st.details || '')}">${esc(st.name || '—')}</td>
              <td>${chip(st.status)}</td>
              <td class="num">${fmtMs(st.executorRunTime)}</td>
              <td class="num">${st.shuffleReadBytes ? fmtBytes(st.shuffleReadBytes) : '—'}</td>
              <td class="num">${st.shuffleWriteBytes ? fmtBytes(st.shuffleWriteBytes) : '—'}</td>
            </tr>`).join('') + '</tbody></table>'
          : `<div class="none">${ids.length ? 'This job’s stages are no longer in the store.' : 'This job ran no stages.'}</div>`;
        return head + `<tr class="substages"><td colspan="5">${inner}</td></tr>`;
      }).join('');
      return '<div class="card card-flush">' +
        cardHead('Execution', 'Jobs & stages', `<span class="note" style="margin:0">${state.jobs.length} job${state.jobs.length === 1 ? '' : 's'} · click one for its stages</span>`) +
        '<table><thead><tr><th>Job</th><th>Name</th><th>Status</th><th>Duration</th><th>Stages</th></tr></thead><tbody>' +
        rows + '</tbody></table></div>';
    }

    function obsSqlSectionHtml() {
      if (!state.sql.length) {
        return emptyState('No SQL executions yet',
          'Every SQL and DataFrame execution the engine runs lands here — Spark Connect sessions, the REST statement API, and the Editor — with its status, duration and plan. Statements you run from the Editor also show up in its own recent-statements rail; the two are not yet one query history (issue #134).');
      }
      const jobById = new Map(state.jobs.map(j => [j.jobId, j]));
      const stageById = new Map(state.stages.map(st => [st.stageId, st]));
      return '<div class="card card-flush">' +
        cardHead('Execution', 'SQL queries', `<span class="note" style="margin:0">${state.sql.length} execution${state.sql.length === 1 ? '' : 's'}</span>`) +
        '<table><thead><tr><th>Execution</th><th>Description</th><th>Status</th><th>Duration</th><th title="derived: summed over the stages this execution’s jobs ran">Rows</th></tr></thead><tbody>' +
        state.sql.map(x => {
          const text = x.description || (x.physicalPlan || '').split('\n')[0] || 'SQL';
          const rows = execRows(x, jobById, stageById);
          return `<tr>
            <td class="num">${x.id}</td>
            <td class="truncate mono" title="${esc(text)}">${esc(text)}</td>
            <td>${chip(x.status)}</td>
            <td class="num">${fmtMs(x.duration)}</td>
            <td class="num">${rows == null ? '—' : fmt(rows)}</td>
          </tr>`;
        }).join('') + '</tbody></table></div>';
    }

    function obsVisible() {
      const el = document.getElementById('panel-observability');
      return el && !el.classList.contains('hidden');
    }

    function renderObservability() {
      const el = document.getElementById('panel-observability');
      if (el.dataset.ready) return;
      el.dataset.ready = '1';
      el.innerHTML = `
        <div class="card">
          ${cardHead('Cluster', 'Exec logs',
            '<button class="btn-secondary" id="obs-dump" title="Copy the selected node\u2019s logs for the filtered window into dumps/, and download it \u2014 the one action on this page that moves log bytes">Dump</button>' +
            '<button class="btn-secondary" id="obs-pause">Pause</button>')}
          <div class="log-controls">
            <label class="log-control"><span class="eyebrow">Node</span><select id="obs-worker"></select></label>
            <label class="log-control"><span class="eyebrow">File</span><select id="obs-file"></select></label>
            <label class="log-control"><span class="eyebrow">Target</span><input type="text" id="obs-target" placeholder="oxidant_execution" /></label>
            <label class="log-control grow"><span class="eyebrow">Search</span><input type="text" id="obs-q" placeholder="free text over the whole file" /></label>
          </div>
          <div class="log-controls">
            <label class="log-control"><span class="eyebrow">From</span><input type="datetime-local" id="obs-from" class="empty" step="1" title="Inclusive lower bound, in your own time zone; sent as an RFC-3339 instant" /></label>
            <label class="log-control"><span class="eyebrow">To</span><input type="datetime-local" id="obs-to" class="empty" step="1" title="Exclusive upper bound, so two adjacent windows tile a day without serving a line twice" /></label>
            <span class="flex" id="obs-filters" style="flex-wrap:wrap"></span>
            <label class="log-toggle"><input type="checkbox" id="obs-follow" checked /> Follow</label>
          </div>
          <div id="obs-logs"></div>
          <div class="note" id="obs-caption"></div>
          <div class="note" id="obs-dump-note"></div>
        </div>
        <div id="obs-jobs"></div>
        <div id="obs-sql"></div>`;

      document.getElementById('obs-pause').onclick = () => {
        obsState.paused = !obsState.paused;
        if (obsState.paused) stopObsTail(); else { obsTick(); startObsTail(); }
        paintObservability();
      };
      document.getElementById('obs-follow').onchange = (e) => {
        obsState.follow = e.target.checked;
        if (obsState.follow) startObsTail(); else stopObsTail();
        paintObservability();
      };
      document.getElementById('obs-dump').onclick = obsRequestDump;

      /* The level row is a **floor**, not a set of independent toggles: `warn` means "warn and
       * error", which is what the API's `level=` means, so the chips and a `curl` agree. Clicking
       * the chip that is already the floor clears it back to every level. Built once — replacing
       * this row's innerHTML on a repaint would detach the button under the pointer. */
      document.getElementById('obs-filters').innerHTML =
        OBS_LEVELS.map(l =>
          `<button class="filter-chip lvl-${l}" data-level="${l}" aria-pressed="false" title="${l} and louder"><i></i>${l}</button>`
        ).join('');
      document.getElementById('obs-filters').onclick = (e) => {
        const btn = e.target.closest('.filter-chip');
        if (!btn) return;
        obsState.level = obsState.level === btn.dataset.level ? null : btn.dataset.level;
        obsReload();
      };

      document.getElementById('obs-worker').onchange = (e) => {
        obsState.worker = e.target.value;
        // A different node has different files; the picker must not offer this one's, and the
        // previous node's missing `current` says nothing about this one's.
        obsState.file = 'current';
        obsState.currentMissing = false;
        obsState.ringFallback = false;
        fetchObsPickers().then(() => obsReload());
      };
      document.getElementById('obs-file').onchange = (e) => {
        obsState.file = e.target.value;
        // An explicit pick outranks the fallback: asking for `current` again on a node that
        // has none must produce the `404`, not be silently redirected to the ring a second
        // time — and picking the ring on purpose is not the pane apologising for the node.
        obsState.ringFallback = false;
        // Following a rolled file is following something that will never grow again. The
        // checkbox's own state is painted from `obsState`, so this is the only place that
        // decides it.
        if (obsState.file !== 'current' && obsState.file !== 'ring') { obsState.follow = false; }
        obsReload();
      };
      // Debounced: a search box that refetched per keystroke would put a Parquet decode behind
      // every character. A date field is typed a component at a time and is no different — a
      // half-entered year is a window nobody asked for.
      let typing = null;
      const onType = () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          obsState.target = document.getElementById('obs-target').value;
          obsState.q = document.getElementById('obs-q').value;
          obsState.from = document.getElementById('obs-from').value;
          obsState.to = document.getElementById('obs-to').value;
          obsReload();
        }, 300);
      };
      for (const id of ['obs-target', 'obs-q', 'obs-from', 'obs-to']) {
        const el = document.getElementById(id);
        el.oninput = () => { el.classList.toggle('empty', !el.value); onType(); };
      }

      paintObservability();
    }

    // A filter changed: re-fetch the page and restart the tail under the new filter, so the
    // followed lines and the paged ones are the same query.
    function obsReload() {
      obsState.dropped = 0;
      paintObservability();
      fetchObsLogs().then(() => { paintObservability(); startObsTail(); });
    }

    function obsPickerHtml() {
      const workers = obsState.workers || [];
      const worker = workers.length
        ? workers.map(w => {
            // **An unreachable worker stays in the picker**, marked. Dropping it would read as
            // "there is no such node", which is not what happened.
            const label = w.worker_id + (w.reachable === false ? ' (unreachable)' : '');
            const sel = w.worker_id === obsState.worker ? ' selected' : '';
            return `<option value="${esc(w.worker_id)}"${sel}>${esc(label)}</option>`;
          }).join('')
        : '<option value="driver" selected>driver</option>';
      const files = obsState.files || [];
      const opts = ['<option value="ring"' + (obsState.file === 'ring' ? ' selected' : '') + '>memory ring (last 1000)</option>']
        .concat(files.map(f => {
          const label = f.file === 'current'
            ? 'current (live)'
            : f.file + ' · ' + f.format + ' · ' + fmtBytes(f.size_bytes);
          const sel = f.file === obsState.file ? ' selected' : '';
          return `<option value="${esc(f.file)}"${sel}>${esc(label)}</option>`;
        }));
      return { worker, file: opts.join('') };
    }

    /* ---- Diagnostic dump ----
     * The one action on this page that copies bytes, and it is a button of its own rather than a
     * mode of the pane — §6b calls it the sanctioned exception, and an operator should have had
     * to ask. It carries the filters on screen, so "bundle what I am looking at" is one click.
     */
    async function obsRequestDump() {
      const note = document.getElementById('obs-dump-note');
      const btn = document.getElementById('obs-dump');
      btn.disabled = true;
      note.textContent = 'Assembling a support bundle…';
      try {
        // The filters on screen, verbatim — the dump route takes the same five, so the bundle
        // is the window the reader is looking at rather than a second query language. The one
        // it does not take is `file`: a dump is a *time* range across a node's whole history,
        // and the server walks whichever files that range lands in.
        const body = { worker: obsState.worker === 'driver' ? 'driver' : obsState.worker };
        if (obsState.level) body.level = obsState.level;
        if (obsState.target.trim()) body.target = obsState.target.trim();
        if (obsState.q.trim()) body.q = obsState.q.trim();
        // Both absent means the server's own default window (the last hour), and the `202`
        // echoes whichever it used — so the note below never has to guess.
        const from = obsInstant(obsState.from), to = obsInstant(obsState.to);
        if (from) body.from = from;
        if (to) body.to = to;
        const r = await fetch('/api/v1/logs/dump', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, obsAuthHeaders()),
          body: JSON.stringify(body),
        });
        const d = await r.json().catch(() => ({}));
        if (r.status !== 202) {
          note.innerHTML = errorState('The dump was refused', d.error || ('HTTP ' + r.status));
          return;
        }
        note.textContent = 'Assembling ' + d.dumpId + ' (' + d.from + ' → ' + d.to + ')…';
        // 202 while building, so poll until it is a file or a reason.
        for (let i = 0; i < 600; i++) {
          const probe = await fetch('/api/v1/logs/dump/' + d.dumpId, { headers: obsAuthHeaders() });
          if (probe.status === 202) { await new Promise(r => setTimeout(r, 500)); continue; }
          if (probe.status === 200) {
            const blob = await probe.blob();
            const url = URL.createObjectURL(blob);
            note.innerHTML = 'Bundle ready: <a href="' + url + '" download="' + esc(d.dumpId) +
              '.parquet">' + esc(d.dumpId) + '.parquet</a> (' + fmtBytes(blob.size) +
              '). It expires after 24 h and is swept with the rest of the data directory.';
            return;
          }
          const err = await probe.json().catch(() => ({}));
          note.innerHTML = errorState('The dump did not complete', err.error || ('HTTP ' + probe.status));
          return;
        }
        note.textContent = 'The dump is still assembling; collect it at /api/v1/logs/dump/' + d.dumpId;
      } catch (e) {
        note.innerHTML = errorState('The dump could not be requested', e.message);
      } finally {
        btn.disabled = false;
      }
    }

    function paintObservability() {
      const el = document.getElementById('panel-observability');
      // refresh() calls this every 2 s; rebuilding a hidden jobs table is pure waste.
      if (!el || !el.dataset.ready || !obsVisible()) return;

      // A floor, so every chip at or above the selected level reads as on.
      const floor = obsState.level == null ? OBS_LEVELS.length - 1 : OBS_LEVELS.indexOf(obsState.level);
      document.querySelectorAll('#obs-filters .filter-chip').forEach(btn => {
        const on = OBS_LEVELS.indexOf(btn.dataset.level) <= floor;
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', obsState.level === btn.dataset.level ? 'true' : 'false');
      });
      document.getElementById('obs-pause').textContent = obsState.paused ? 'Resume' : 'Pause';

      // One owner for the follow switch. It used to be set only where a file was picked, so
      // choosing a rolled file and then switching node left the box disabled on a live file.
      const follow = document.getElementById('obs-follow');
      follow.disabled = obsState.file !== 'current' && obsState.file !== 'ring';
      follow.checked = obsState.follow && !follow.disabled;

      // The pickers repaint only when their contents changed: rewriting a <select> under an open
      // dropdown closes it.
      const picks = obsPickerHtml();
      const workerSel = document.getElementById('obs-worker');
      if (workerSel.dataset.sig !== picks.worker) { workerSel.dataset.sig = picks.worker; workerSel.innerHTML = picks.worker; }
      const fileSel = document.getElementById('obs-file');
      if (fileSel.dataset.sig !== picks.file) { fileSel.dataset.sig = picks.file; fileSel.innerHTML = picks.file; }

      // Keep the pane pinned to the newest line unless the reader has scrolled up into it.
      const prev = document.getElementById('obs-logwrap');
      const pinned = !prev || prev.scrollTop + prev.clientHeight >= prev.scrollHeight - 24;
      document.getElementById('obs-logs').innerHTML = obsLogsSectionHtml();
      const wrap = document.getElementById('obs-logwrap');
      if (wrap && pinned) wrap.scrollTop = wrap.scrollHeight;
      const older = document.getElementById('obs-older');
      if (older) older.onclick = fetchObsOlder;
      document.getElementById('obs-caption').textContent = obsLogsCaptionHtml();

      document.getElementById('obs-jobs').innerHTML = obsJobsSectionHtml();
      document.querySelectorAll('#obs-jobs tr.selectable').forEach(tr => {
        tr.onclick = () => {
          const id = Number(tr.dataset.job);
          obsState.expanded[id] = !obsState.expanded[id];
          paintObservability();
        };
      });
      document.getElementById('obs-sql').innerHTML = obsSqlSectionHtml();
    }

    // The fallback poll. It stays even while following: an SSE stream a proxy drops is silent,
    // and a pane that has stopped updating must not look like a quiet cluster.
    function obsTick() {
      fetchObsLogs().then(paintObservability);
    }

    function openObservability() {
      renderObservability();
      fetchObsPickers().then(() => { paintObservability(); });
      obsTick();
      startObsTail();
      if (!obsState.timer) obsState.timer = setInterval(obsTick, OBS_POLL_MS);
    }

    function stopObservability() {
      if (obsState.timer) { clearInterval(obsState.timer); obsState.timer = null; }
      stopObsTail();
    }

    /* ---------- SQL editor + notebook (REST statements API) ---------- */
    const TERMINAL = { succeeded: 1, failed: 1, canceled: 1 };
