    const RESULT_LIMIT = 500;

    async function readJson(r) {
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    }

    const stmtApi = {
      submit: (sql) => fetch('/api/v1/statements?wait=true&timeout=60', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql }),
      }).then(readJson),
      list: () => fetch('/api/v1/statements').then(readJson),
      get: (id) => fetch('/api/v1/statements/' + id).then(readJson),
      result: (id, limit) => fetch('/api/v1/statements/' + id + '/result?format=json&limit=' + (limit || RESULT_LIMIT)).then(readJson),
      cancel: (id) => fetch('/api/v1/statements/' + id + '/cancel', { method: 'POST' }).then(readJson),
    };

    // Poll a pending/running statement every 1s until it reaches a terminal status.
    async function waitStatement(doc, onUpdate) {
      let cur = doc;
      while (!TERMINAL[cur.status]) {
        if (onUpdate) onUpdate(cur);
        await new Promise(r => setTimeout(r, 1000));
        cur = await stmtApi.get(cur.statementId);
      }
      if (onUpdate) onUpdate(cur);
      return cur;
    }

    // Submit with ?wait=true&timeout=60; keep polling if still running after that.
    async function runStatement(sql, onUpdate) {
      return waitStatement(await stmtApi.submit(sql), onUpdate);
    }

    function cellHtml(v) {
      if (v === null || v === undefined) return '<td class="muted">NULL</td>';
      if (typeof v === 'object') return '<td>' + esc(JSON.stringify(v)) + '</td>';
      return '<td>' + esc(String(v)) + '</td>';
    }

    // Schema-aware result table; caps rendered rows (fetch limit) with a "showing N of M" note.
    function resultTableHtml(res, fullRowCount) {
      const fields = (res.schema && res.schema.fields) || [];
      const cols = fields.length ? fields.map(f => f.name) : Object.keys(res.rows[0] || {});
      const typeOf = (c) => { const f = fields.find(f => f.name === c); return f ? f.type : ''; };
      const total = fullRowCount != null ? fullRowCount : res.rowCount;
      let html = total > res.rows.length
        ? `<div class="note">Showing ${res.rows.length.toLocaleString()} of ${total.toLocaleString()} rows (limit ${RESULT_LIMIT}).</div>`
        : `<div class="note">${res.rows.length.toLocaleString()} row${res.rows.length === 1 ? '' : 's'}</div>`;
      html += '<div class="result-wrap"><table><thead><tr>' +
        cols.map(c => `<th>${esc(c)} <span class="muted">${esc(typeOf(c))}</span></th>`).join('') +
        '</tr></thead><tbody>' +
        res.rows.map(r => '<tr>' + cols.map(c => cellHtml(r[c])).join('') + '</tr>').join('') +
        '</tbody></table></div>';
      return html;
    }

    /* ---------- Editor panel ---------- */
    let editorBusy = false;
    let editorRunId = null;

    function renderEditor() {
      const el = document.getElementById('panel-editor');
      el.innerHTML = `<div class="editor-grid">
        <div>
          <div class="card">
            ${cardHead('Query', 'SQL editor')}
            <label for="editor-sql">Cmd/Ctrl+Enter to run</label>
            <textarea id="editor-sql" rows="8" spellcheck="false">SELECT 1 AS hello</textarea>
            <div class="flex" style="margin-top:12px">
              <button class="btn" id="editor-run">Run</button>
              <button class="btn-secondary" id="editor-cancel" disabled>Cancel</button>
              <span class="note" id="editor-status" style="margin:0"></span>
            </div>
          </div>
          <div id="editor-error" style="margin-bottom:16px"></div>
          <div id="editor-result"></div>
        </div>
        <div class="card">
          <div class="flex" style="justify-content:space-between;margin-bottom:8px">
            <span class="eyebrow">Recent statements</span>
            <button class="nb-btn" id="editor-refresh">Refresh</button>
          </div>
          <div id="editor-statements"><span class="muted">Loading…</span></div>
        </div>
      </div>`;
      document.getElementById('editor-run').onclick = runEditor;
      document.getElementById('editor-cancel').onclick = cancelEditor;
      document.getElementById('editor-refresh').onclick = loadEditorStatements;
      document.getElementById('editor-sql').addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runEditor(); }
      });
      loadEditorStatements();
    }

    function setEditorRunning(running) {
      document.getElementById('editor-run').disabled = running;
      document.getElementById('editor-cancel').disabled = !running;
    }

    function setEditorStatus(doc) {
      const el = document.getElementById('editor-status');
      if (!doc) { el.textContent = ''; return; }
      el.innerHTML = chip(doc.status) +
        (doc.durationMs != null ? ' · ' + fmtMs(doc.durationMs) : '') +
        (doc.rowCount != null ? ' · ' + doc.rowCount.toLocaleString() + ' rows' : '');
    }

    // Render a terminal statement doc into the given result/error containers.
    async function showStatementResult(doc, resultEl, errorEl) {
      if (doc.status === 'failed') {
        resultEl.innerHTML = '';
        errorEl.innerHTML = errorState('Statement failed', doc.error || 'statement failed');
        return;
      }
      if (doc.status === 'canceled') {
        resultEl.innerHTML = emptyState('Statement canceled');
        return;
      }
      if (doc.status !== 'succeeded') return;
      const res = await stmtApi.result(doc.statementId, RESULT_LIMIT);
      resultEl.innerHTML = '<div class="card">' + resultTableHtml(res, doc.rowCount) + '</div>';
    }

    async function runEditor() {
      if (editorBusy) return;
      const sql = document.getElementById('editor-sql').value.trim();
      if (!sql) return;
      editorBusy = true;
      setEditorRunning(true);
      setEditorStatus(null);
      document.getElementById('editor-error').innerHTML = '';
      document.getElementById('editor-result').innerHTML = '';
      try {
        const doc = await runStatement(sql, (d) => { editorRunId = d.statementId; setEditorStatus(d); });
        await showStatementResult(doc, document.getElementById('editor-result'), document.getElementById('editor-error'));
      } catch (e) {
        document.getElementById('editor-error').innerHTML = errorState('Statement failed', e.message);
      } finally {
        editorBusy = false;
        editorRunId = null;
        setEditorRunning(false);
        loadEditorStatements();
      }
    }

    async function cancelEditor() {
      if (!editorRunId) return;
      try { await stmtApi.cancel(editorRunId); } catch (_) { /* already terminal — the poll loop surfaces it */ }
    }

    async function loadEditorStatements() {
      const el = document.getElementById('editor-statements');
      if (!el) return;
      try {
        const d = await stmtApi.list();
        const stmts = d.statements || [];
        if (!stmts.length) { el.innerHTML = '<span class="muted">No statements yet.</span>'; return; }
        el.innerHTML = stmts.map(s => `<div class="stmt-item" data-id="${s.statementId}">
          <div class="flex" style="justify-content:space-between">
            ${chip(s.status)}
            <span class="muted num">${fmtMs(s.durationMs)}</span>
          </div>
          <div class="stmt-sql" title="${esc(s.sql)}">${esc(s.sql)}</div>
        </div>`).join('');
        el.querySelectorAll('.stmt-item').forEach(item => { item.onclick = () => loadStatement(item.dataset.id); });
      } catch (e) {
        el.innerHTML = `<span class="muted">Failed to load: ${esc(e.message)}</span>`;
      }
    }

    // Click a recent statement: reload its status/result into the editor panes.
    async function loadStatement(id) {
      const resultEl = document.getElementById('editor-result');
      const errorEl = document.getElementById('editor-error');
      errorEl.innerHTML = '';
      resultEl.innerHTML = '<div class="card muted">Loading…</div>';
      try {
        const doc = await waitStatement(await stmtApi.get(id), setEditorStatus);
        await showStatementResult(doc, resultEl, errorEl);
      } catch (e) {
        resultEl.innerHTML = '';
        errorEl.innerHTML = errorState('Could not load the statement', e.message);
      }
    }

    /* ---------- Notebook panel ---------- */
    const NB_KEY = 'oxidant.notebook.v1';
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    let notebook = loadNotebook();
    const nbOutputs = {};  // cellId -> { running, doc, result, error } (in-memory only)
    let nbRunningAll = false;

    function loadNotebook() {
      try {
        const d = JSON.parse(localStorage.getItem(NB_KEY) || 'null');
        if (d && Array.isArray(d.cells)) {
          const cells = d.cells
            .filter(c => c && (c.type === 'sql' || c.type === 'md' || c.type === 'markdown'))
            .map(c => ({ id: c.id || uid(), type: c.type === 'markdown' ? 'md' : c.type, source: String(c.source || '') }));
          if (cells.length) return { cells };
        }
      } catch (_) {}
      return { cells: [{ id: uid(), type: 'sql', source: 'SELECT 1 AS hello' }] };
    }

    function saveNotebook() {
      localStorage.setItem(NB_KEY, JSON.stringify({
        version: 1,
        cells: notebook.cells.map(c => ({ type: c.type, source: c.source })),
      }));
    }

    // Tiny Markdown renderer (headings, bold/italic, inline code, code fences, lists,
    // links) — hand-rolled so the binary stays self-contained (no CDN / air-gap).
    function mdInline(s) {
      let out = esc(s);
      const codes = [];
      out = out.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
      out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      out = out.replace(/\*([^*\s][^*]*)\*/g, '<em>$1</em>');
      out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      out = out.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[+i] + '</code>');
      return out;
    }

    function renderMarkdown(src) {
      const out = [];
      let inFence = false, fence = [], inList = false;
      const closeList = () => { if (inList) { out.push('</ul>'); inList = false; } };
      for (const line of src.split('\n')) {
        if (line.trim().startsWith('```')) {
          if (inFence) { out.push('<pre>' + esc(fence.join('\n')) + '</pre>'); fence = []; inFence = false; }
          else { closeList(); inFence = true; }
          continue;
        }
        if (inFence) { fence.push(line); continue; }
        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) { closeList(); const lvl = h[1].length; out.push('<h' + lvl + '>' + mdInline(h[2]) + '</h' + lvl + '>'); continue; }
        const li = line.match(/^\s*[-*]\s+(.*)$/);
        if (li) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + mdInline(li[1]) + '</li>'); continue; }
        closeList();
        if (!line.trim()) continue;
        out.push('<p>' + mdInline(line) + '</p>');
      }
      closeList();
      if (inFence) out.push('<pre>' + esc(fence.join('\n')) + '</pre>');
      return out.join('\n');
    }

    function renderNotebook() {
      const el = document.getElementById('panel-notebook');
      el.innerHTML = `<div class="card">
        ${cardHead('Query', 'Notebook')}
        <div class="flex" style="flex-wrap:wrap">
          <button class="btn" id="nb-add-sql">+ SQL cell</button>
          <button class="btn-secondary" id="nb-add-md">+ Markdown cell</button>
          <button class="btn-secondary" id="nb-run-all">Run all</button>
          <button class="btn-secondary" id="nb-export">Export</button>
          <button class="btn-secondary" id="nb-import">Import</button>
          <input type="file" id="nb-file" accept="application/json" class="hidden" />
          <span class="note" id="nb-status" style="margin:0"></span>
        </div>
      </div>
      <div id="nb-cells"></div>`;
      document.getElementById('nb-add-sql').onclick = () => addNbCell('sql');
      document.getElementById('nb-add-md').onclick = () => addNbCell('md');
      document.getElementById('nb-run-all').onclick = runAllNbCells;
      document.getElementById('nb-export').onclick = exportNotebook;
      document.getElementById('nb-import').onclick = () => document.getElementById('nb-file').click();
      document.getElementById('nb-file').onchange = (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) importNotebook(f);
        e.target.value = '';
      };
      renderNbCells();
    }

    function addNbCell(type) {
      notebook.cells.push({ id: uid(), type, source: '' });
      saveNotebook();
      renderNbCells();
    }

    function nbCellHtml(c, i) {
      const n = notebook.cells.length;
      const rows = Math.min(12, Math.max(3, c.source.split('\n').length + 1));
      return `<div class="nb-cell" data-id="${c.id}">
        <div class="nb-toolbar">
          <span class="nb-tag">${c.type === 'sql' ? 'SQL' : 'Markdown'}</span>
          ${c.type === 'sql' ? '<button class="nb-btn" data-act="run">Run</button>' : ''}
          <button class="nb-btn" data-act="up" ${i === 0 ? 'disabled' : ''}>&#8593;</button>
          <button class="nb-btn" data-act="down" ${i === n - 1 ? 'disabled' : ''}>&#8595;</button>
          <button class="nb-btn" data-act="del">Delete</button>
        </div>
        <textarea rows="${rows}" spellcheck="false">${esc(c.source)}</textarea>
        ${c.type === 'md' ? `<div class="md nb-output" id="nb-prev-${c.id}"></div>` : ''}
        ${c.type === 'sql' ? `<div class="nb-output" id="nb-out-${c.id}"></div>` : ''}
      </div>`;
    }

    function renderNbCells() {
      const wrap = document.getElementById('nb-cells');
      if (!notebook.cells.length) {
        wrap.innerHTML = emptyState('Empty notebook', 'Add a SQL or Markdown cell to get started.');
        return;
      }
      wrap.innerHTML = notebook.cells.map((c, i) => nbCellHtml(c, i)).join('');
      notebook.cells.forEach((c, i) => bindNbCell(c, i));
      notebook.cells.forEach(c => {
        if (c.type === 'md') paintNbPreview(c.id);
        else if (nbOutputs[c.id]) paintNbOutput(c.id);
      });
    }

    function bindNbCell(c, i) {
      const root = document.querySelector('.nb-cell[data-id="' + c.id + '"]');
      if (!root) return;
      const ta = root.querySelector('textarea');
      // Keep cell.source in sync as the user types WITHOUT re-rendering (a re-render
      // would clobber the textarea); full renders happen on structural ops only.
      ta.addEventListener('input', () => {
        c.source = ta.value;
        saveNotebook();
        if (c.type === 'md') paintNbPreview(c.id);
      });
      ta.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && c.type === 'sql') { e.preventDefault(); runNbCell(c.id); }
      });
      root.querySelectorAll('.nb-btn[data-act]').forEach(b => {
        b.onclick = () => {
          const act = b.dataset.act;
          if (act === 'run') runNbCell(c.id);
          else if (act === 'del') {
            notebook.cells = notebook.cells.filter(x => x.id !== c.id);
            delete nbOutputs[c.id];
            saveNotebook();
            renderNbCells();
          } else if (act === 'up' || act === 'down') {
            const j = act === 'up' ? i - 1 : i + 1;
            if (j < 0 || j >= notebook.cells.length) return;
            const tmp = notebook.cells[i];
            notebook.cells[i] = notebook.cells[j];
            notebook.cells[j] = tmp;
            saveNotebook();
            renderNbCells();
          }
        };
      });
    }

    function paintNbPreview(id) {
      const el = document.getElementById('nb-prev-' + id);
      const c = notebook.cells.find(x => x.id === id);
      if (el && c) el.innerHTML = renderMarkdown(c.source);
    }

    async function runNbCell(id) {
      const c = notebook.cells.find(x => x.id === id);
      if (!c || c.type !== 'sql' || !c.source.trim()) return;
      if (nbOutputs[id] && nbOutputs[id].running) return;
      nbOutputs[id] = { running: true };
      paintNbOutput(id);
      try {
        const doc = await runStatement(c.source, (d) => { nbOutputs[id] = { running: !TERMINAL[d.status], doc: d }; paintNbOutput(id); });
        if (doc.status === 'succeeded') {
          nbOutputs[id] = { doc, result: await stmtApi.result(doc.statementId, RESULT_LIMIT) };
        } else {
          nbOutputs[id] = { doc };
        }
      } catch (e) {
        nbOutputs[id] = { error: e.message };
      }
      paintNbOutput(id);
    }

    function paintNbOutput(id) {
      const el = document.getElementById('nb-out-' + id);
      if (!el) return;
      const o = nbOutputs[id];
      if (!o) { el.innerHTML = ''; return; }
      if (o.running) {
        el.innerHTML = `<div class="note">${chip(o.doc ? o.doc.status : 'running')}</div>`;
        return;
      }
      if (o.error) { el.innerHTML = errorState('Cell failed', o.error); return; }
      if (o.doc && o.doc.status === 'failed') { el.innerHTML = errorState('Cell failed', o.doc.error || 'statement failed'); return; }
      if (o.doc && o.doc.status === 'canceled') { el.innerHTML = `<div class="note">${chip('canceled')}</div>`; return; }
      if (o.doc && o.result) {
        el.innerHTML = `<div class="note">${chip('succeeded')} · ${fmtMs(o.doc.durationMs)}</div>` + resultTableHtml(o.result, o.doc.rowCount);
      }
    }

    async function runAllNbCells() {
      if (nbRunningAll) return;
      nbRunningAll = true;
      const status = document.getElementById('nb-status');
      try {
        for (const c of notebook.cells) {
          if (c.type !== 'sql') continue;
          status.textContent = 'Running cell ' + (notebook.cells.indexOf(c) + 1) + ' of ' + notebook.cells.length + '…';
          await runNbCell(c.id);
        }
      } finally {
        status.textContent = '';
        nbRunningAll = false;
      }
    }

    function exportNotebook() {
      const data = JSON.stringify({
        version: 1,
        cells: notebook.cells.map(c => ({ type: c.type, source: c.source })),
      }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'oxidant-notebook.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(a.href);
    }

    function importNotebook(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const d = JSON.parse(String(reader.result));
          const cells = ((d && d.cells) || [])
            .filter(c => c && (c.type === 'sql' || c.type === 'md' || c.type === 'markdown'))
            .map(c => ({ id: uid(), type: c.type === 'markdown' ? 'md' : c.type, source: String(c.source || '') }));
          if (!cells.length) throw new Error('no cells in file');
          notebook = { cells };
          Object.keys(nbOutputs).forEach(k => delete nbOutputs[k]);
          saveNotebook();
          renderNotebook();
        } catch (e) {
          alert('Import failed: ' + e.message);
        }
      };
      reader.readAsText(file);
    }

    /* ---------- Pipelines: the live streaming monitor ----------
     *
     * ## A micro-batch never reaches the execution store. Read this before "fixing" the page.
     *
     * `oxidant-streaming` does not depend on `oxidant-observability`. The scheduler runs each
     * micro-batch straight through `Engine::execute_logical_plan` and records the outcome as an
     * in-process `QueryProgress` on the `StreamingQuery`; nothing calls `QueryTracker::begin`
     * for a batch. So `/sql`, `/jobs` and `/stages` hold **no streaming work at all** —
     * permanently, not "until the first batch lands". The first cut of this page derived a
     * pipeline from those surfaces and was therefore empty against a real `postgres_cdc`
     * pipeline, whatever it was doing.
     *
     * Closing that gap is a per-batch observer on `StreamingQueryManager` plus wiring in
     * `oxidant-connect` — the streaming engine's contract, not this page's. Until it exists,
     * the *connector's own JSONL log* is the primary signal here, and it is a better one than
     * the execution store would have been:
     *
     *   /api/v1/pipelines               the connector logs on disk, newest write first. The
     *                                   only pipeline registry reachable from this crate.
     *   /api/v1/pipelines/{name}/logs   that connector's events. `batch` carries rows and
     *                                   duration, `slot_metrics` carries WAL retained /
     *                                   replication lag / confirmed LSN, `commit` carries the
     *                                   flush position actually sent to the publisher,
     *                                   `snapshot_start` / `snapshot_done` carry backfill
     *                                   progress, and `error` carries the text that exists
     *                                   nowhere else.
     *   /api/status                     a cross-check that annotates and never overrules the
     *                                   connector log. Its `tag` is a query *description* —
     *                                   truncated SQL text — not a name, so a match has to be
     *                                   a structural streaming identity for the whole tag;
     *                                   substring-matching a pipeline name against SQL text
     *                                   marked healthy pipelines stopped. Nothing the engine
     *                                   emits today is such an identity, by construction: a
     *                                   micro-batch never reaches the execution store.
     *
     * All three are gated behind `OXIDANT_STATUS_TOKEN`, so without a token this page has
     * nothing to show and says exactly that rather than "no pipelines".
     *
     * Three numbers are *observed*, not reported, and are labelled: the trigger interval
     * (median gap between batch starts), rows/sec (rows in the last minute over the span they
     * covered), and liveness (how long since the newest logged event — a driver-clock stamp
     * compared against this browser's clock, so the live window is floored at 30 s rather than
     * cut fine). Nothing else is estimated.
     *
     * The connector log does not record a sink. That column is absent rather than guessed.
     */
    /* Everything that folds a connector log into what this page says lives in
       `pipeline_derive.js` and is spliced in here when the binary serves this page — see
       `static_files.rs`. It is a separate file for one reason: a 200-line reducer that decides
       whether an operator is told a pipeline has stopped has to be tested, and this page has no
       build step, no module loader and no way to be imported. `ui/src/lib/pipelineDerive.test.ts`
       evaluates that exact source. Everything below is fetching and rendering. */
    /*__PIPELINE_DERIVE_JS__*/
    const {
      PIPE_POLL_MS, PIPE_LOG_TAIL, PIPE_MAX_TAILED,
      shortTs, fmtRate, fmtInterval, fmtAgo,
      pipeLastError, shouldRefetchTail, capturePipeScroll, restorePipeScroll,
    } = __oxidantPipelines;
    const PIPE_TOKEN_KEY = 'oxidant.statusToken';

    const pipeState = {
      token: (() => { try { return localStorage.getItem(PIPE_TOKEN_KEY) || ''; } catch (e) { return ''; } })(),
      list: null,          // [{ name, sizeBytes, modifiedMs }] from /api/v1/pipelines
      listCode: null,      // null = never asked (no token), else the HTTP status
      listTruncated: false,
      status: null,        // last /api/status body — the secondary signal
      statusCode: null,
      selected: null,      // name of the pipeline whose drawer is open
      logs: {},            // name -> { code, events, malformed, truncated, at, loading }
      timer: null,
      derived: [],
    };


    /* ---------- Fetching ---------- */

    const pipeAuth = () => ({ Authorization: 'Bearer ' + pipeState.token });

    async function fetchPipeList() {
      if (!pipeState.token) { pipeState.list = null; pipeState.listCode = null; return; }
      try {
        const r = await fetch('/api/v1/pipelines', { headers: pipeAuth() });
        pipeState.listCode = r.status;
        if (!r.ok) { pipeState.list = null; return; }
        const d = await r.json();
        pipeState.list = Array.isArray(d.pipelines) ? d.pipelines : [];
        pipeState.listTruncated = !!d.truncated;
      } catch (e) {
        pipeState.listCode = 0;
        pipeState.list = null;
      }
    }

    // 404 means this build serves no connector logs (or this pipeline has none); 401 means the
    // token is missing or wrong. Both are states the page renders, not errors it swallows.
    function ensurePipeLogs(name, force) {
      const cur = pipeState.logs[name];
      const now = Date.now();
      if (!shouldRefetchTail(cur, now, force)) return;
      pipeState.logs[name] = Object.assign({}, cur, { loading: true, at: now });
      const headers = pipeState.token ? pipeAuth() : {};
      fetch('/api/v1/pipelines/' + encodeURIComponent(name) + '/logs?tail=' + PIPE_LOG_TAIL, { headers })
        .then(async (r) => {
          if (!r.ok) return { code: r.status };
          const d = await r.json();
          return { code: 200, events: d.events || [], malformed: d.malformed || 0, truncated: !!d.truncated };
        })
        .catch((e) => ({ code: 0, error: e.message }))
        .then((res) => {
          // `at` is when this request *started*, not when it returned: re-stamping on
          // completion pushed the guard past the next tick and halved the refresh rate.
          pipeState.logs[name] = Object.assign(res, { at: now, doneAt: Date.now(), loading: false });
          paintPipelines();
          paintPipeDrawer();
        });
    }

    async function fetchPipeStatus() {
      if (!pipeState.token) { pipeState.status = null; pipeState.statusCode = null; return; }
      try {
        const r = await fetch('/api/status?limit=200', { headers: pipeAuth() });
        pipeState.statusCode = r.status;
        pipeState.status = r.ok ? await r.json() : null;
      } catch (e) {
        pipeState.statusCode = 0;
        pipeState.status = null;
      }
    }

    /* ---------- Derivation, from the connector log ---------- */

    // The page's inputs, folded by `pipeline_derive.js`. `/api/status` is a cross-check that
    // annotates and never overrules the connector log — see `statusQueryFor` there for why a
    // substring match on a query's SQL text could not be one.
    function derivePipelines() {
      return __oxidantPipelines.derivePipelines(
        pipeState.list, pipeState.logs, Date.now(),
        pipeState.status && pipeState.status.queries);
    }

    /* ---------- Connector log rendering ---------- */

    function logLineHtml(ev) {
      if (ev == null || typeof ev !== 'object' || Array.isArray(ev)) {
        return `<div class="logline"><span class="msg">${esc(JSON.stringify(ev))}</span></div>`;
      }
      const rest = Object.assign({}, ev);
      const stamp = rest.ts || rest.timestamp || rest.time || '';
      const level = String(rest.level || rest.severity || '').toLowerCase();
      ['ts', 'timestamp', 'time', 'level', 'severity'].forEach(k => delete rest[k]);
      const headline = rest.message || rest.msg || rest.event || rest.error;
      ['message', 'msg', 'event'].forEach(k => delete rest[k]);
      if (headline === rest.error) delete rest.error;
      const extras = Object.keys(rest)
        .map(k => k + '=' + (typeof rest[k] === 'object' ? JSON.stringify(rest[k]) : String(rest[k])))
        .join(' ');
      const text = headline ? (extras ? headline + '  ' + extras : headline) : (extras || JSON.stringify(ev));
      const isError = /^err|^fatal/.test(level) || String(ev.event || '') === 'error';
      const cls = isError ? 'lvl-error' : (/^warn/.test(level) ? 'lvl-warn' : '');
      return `<div class="logline ${cls}"><span class="ts">${esc(shortTs(stamp))}</span><span class="msg">${esc(text)}</span></div>`;
    }

    /* ---------- Rendering ---------- */

    function pipeVisible() {
      const el = document.getElementById('panel-pipelines');
      return el && !el.classList.contains('hidden');
    }

    function renderPipelines() {
      const el = document.getElementById('panel-pipelines');
      if (el.dataset.ready) return;
      el.dataset.ready = '1';
      el.innerHTML = `
        <div class="card">
          ${cardHead('Streaming', 'Pipelines', '<span class="note" style="margin:0" id="pipe-freshness"></span>')}
          <div class="metrics" id="pipe-metrics"></div>
          <div class="note">
            Read from each connector's own JSONL log, not from the execution store: a streaming
            micro-batch is never registered with the observability store, so the
            <strong>Jobs</strong>, <strong>Stages</strong> and <strong>SQL</strong> pages hold no
            streaming work and never will until a per-batch observer is wired into the streaming
            query manager. Everything on this page is a connector event, plus
            <code>/api/status</code> as a cross-check.
          </div>
        </div>
        <div id="pipe-banner"></div>
        <div id="pipe-list"></div>
        <div class="card">
          ${cardHead('Access', 'Driver status token', '<span id="pipe-auth-chip"></span>')}
          <div class="note" style="margin-top:0">
            Required, not optional: <code>/api/v1/pipelines</code>,
            <code>/api/v1/pipelines/&hellip;/logs</code> and <code>/api/status</code> are all gated
            behind <code>OXIDANT_STATUS_TOKEN</code>, and they are this page's only sources. The
            token is kept in this browser only, and is sent to this driver only.
          </div>
          <div class="flex" style="flex-wrap:wrap">
            <input type="password" id="pipe-token" placeholder="OXIDANT_STATUS_TOKEN" autocomplete="off" spellcheck="false" />
            <button class="btn" id="pipe-token-save">Use</button>
            <button class="btn-secondary" id="pipe-token-clear">Clear</button>
          </div>
        </div>`;
      const input = document.getElementById('pipe-token');
      input.value = pipeState.token;
      document.getElementById('pipe-token-save').onclick = () => {
        pipeState.token = input.value.trim();
        try { localStorage.setItem(PIPE_TOKEN_KEY, pipeState.token); } catch (e) {}
        pipeState.logs = {};
        pipeTick();
      };
      document.getElementById('pipe-token-clear').onclick = () => {
        pipeState.token = '';
        input.value = '';
        try { localStorage.removeItem(PIPE_TOKEN_KEY); } catch (e) {}
        pipeState.status = null;
        pipeState.statusCode = null;
        pipeState.list = null;
        pipeState.listCode = null;
        pipeState.logs = {};
        paintPipelines();
        paintPipeDrawer();
      };
      paintPipelines();
    }

    function authChipHtml() {
      if (!pipeState.token) return chip('idle', 'no token');
      const code = pipeState.listCode != null ? pipeState.listCode : pipeState.statusCode;
      if (code === 200) return chip('ok', 'authorized');
      if (code === 401 || code === 403) return chip('failed', 'rejected');
      if (code === 404) return chip('idle', 'no connector logs');
      if (code == null) return chip('pending', 'not polled');
      return chip('failed', 'error ' + code);
    }

    // Why the list is empty, in the words of the thing that made it empty.
    function pipeEmptyStateHtml() {
      if (!pipeState.token) {
        return emptyState('This page needs the driver status token',
          'Every source it reads — the pipeline list, the connector logs, /api/status — is gated behind OXIDANT_STATUS_TOKEN. Paste it below.');
      }
      if (pipeState.listCode === 401 || pipeState.listCode === 403) {
        return emptyState('That token was rejected',
          'The driver answered 401. Check OXIDANT_STATUS_TOKEN on the server.');
      }
      if (pipeState.listCode === 404) {
        return emptyState('This driver serves no connector logs',
          'GET /api/v1/pipelines answers 404 when OXIDANT_STATUS_TOKEN is unset, when OXIDANT_CHECKPOINT_DIR is unset, or when its logs/ directory does not exist yet — the directory appears when the first connector starts. Set OXIDANT_CHECKPOINT_DIR to the same path as pipeline.checkpoints in oxidant.yaml.');
      }
      if (pipeState.listCode == null) return emptyState('Not polled yet');
      if (pipeState.listCode !== 200) {
        return errorState('Could not list pipelines', 'GET /api/v1/pipelines answered ' + pipeState.listCode + '.');
      }
      return emptyState('No streaming pipeline has written a connector log yet',
        'A pipeline appears here on its first logged event — slot metrics, a snapshot, or a batch. Note that a query started through Spark Connect readStream() has no checkpoint root to log under, so it will not appear; a pipeline declared in oxidant.yaml will.');
    }

    function paintPipelines() {
      const panel = document.getElementById('panel-pipelines');
      // A fetch can land after the reader has moved on; repainting a hidden table is wasted
      // work on a page that also repaints every 2 s.
      if (!panel || !panel.dataset.ready || !pipeVisible()) return;
      const pipelines = derivePipelines();
      pipeState.derived = pipelines;

      const running = pipelines.filter(p => p.state === 'running').length;
      const troubled = pipelines.filter(p => p.state === 'error' || p.retrying);
      const rate = pipelines.reduce((a, p) => a + (p.rowsPerSec || 0), 0);
      const rows = pipelines.reduce((a, p) => a + (p.windowRows || 0), 0);
      const retained = pipelines.reduce((a, p) => Math.max(a, (p.slot && p.slot.retainedBytes) || 0), 0);
      const lag = pipelines.reduce((a, p) => Math.max(a, (p.slot && p.slot.lagBytes) || 0), 0);
      const anySlot = pipelines.some(p => p.slot);
      document.getElementById('pipe-metrics').innerHTML = [
        ['Pipelines', String(pipelines.length)],
        ['Running', String(running)],
        ['Rows / s (60 s)', pipelines.length ? fmtRate(rate) : '—'],
        ['Rows (60 s)', pipelines.length ? rows.toLocaleString() : '—'],
        ['WAL retained (max)', anySlot ? fmtBytes(retained) : '—'],
        ['Replication lag (max)', anySlot ? fmtBytes(lag) : '—'],
      ].map(([k, v]) => `<div class="metric"><div class="eyebrow">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

      const newest = pipelines.length ? pipelines[0].lastEventMs : null;
      const tailed = Math.min(pipelines.length, PIPE_MAX_TAILED);
      document.getElementById('pipe-freshness').textContent =
        (newest ? 'newest event ' + new Date(newest).toISOString().slice(11, 19) + ' UTC' : 'no events seen') +
        ' · polling every ' + (PIPE_POLL_MS / 1000) + ' s' +
        (pipelines.length > tailed ? ' · tailing the ' + tailed + ' most recent of ' + pipelines.length : '') +
        (pipeState.listTruncated ? ' · the driver truncated its pipeline list' : '');

      // An error is louder than the chip in its row: the newest troubled pipeline gets a banner.
      const banner = document.getElementById('pipe-banner');
      if (troubled.length) {
        const p = troubled[0];
        const verb = p.state === 'error' ? 'has stopped' : 'is retrying a failed batch';
        banner.innerHTML = errorState(
          troubled.length > 1 ? troubled.length + ' pipelines need attention — ' + p.name : p.name + ' ' + verb,
          pipeLastError(p) || 'No error text is available from this driver.');
      } else {
        banner.innerHTML = '';
      }

      const list = document.getElementById('pipe-list');
      if (!pipelines.length) {
        list.innerHTML = pipeEmptyStateHtml();
      } else {
        list.innerHTML = '<div class="card card-flush">' +
          cardHead('Live', 'Streaming pipelines', '<span class="note" style="margin:0">click a row for batch history and the connector log</span>') +
          '<table><thead><tr><th>Pipeline</th><th>Source</th><th>State</th><th>Trigger</th><th>Last batch</th><th>Rows</th><th>Duration</th><th>Rows / s</th><th>Confirmed LSN</th><th>WAL retained</th></tr></thead><tbody>' +
          pipelines.map(p => {
            const b = p.last;
            return `<tr class="selectable ${pipeState.selected === p.name ? 'selected' : ''}" data-name="${esc(p.name)}">
            <td>${esc(p.name)}</td>
            <td class="mono truncate" title="${esc(p.source || 'the connector log does not name its source')}">${esc(p.source || '—')}</td>
            <td>${chip(p.state)}${p.retrying && p.state !== 'error' ? ' ' + chip('pending', 'retrying') : ''}</td>
            <td class="num" title="observed: median gap between batch starts">${fmtInterval(p.triggerMs)}</td>
            <td class="mono truncate" title="${esc(b ? 'batch #' + b.ordinal + ' of the log tail' + (b.at ? ' · ' + b.at : '') : 'no batch in the log tail')}">${b ? esc(p.lastBatchLabel) + (b.kind === 'snapshot' ? ' snap' : '') : '—'}</td>
            <td class="num">${b ? fmt(b.rows) : '—'}</td>
            <td class="num">${b ? fmtMs(b.durationMs) : '—'}</td>
            <td class="num" title="observed: rows in the last 60 s over the span they covered">${fmtRate(p.rowsPerSec)}</td>
            <td class="mono truncate" title="${esc(p.position || '')}">${esc(p.position || '—')}</td>
            <td class="num">${p.slot ? fmtBytes(p.slot.retainedBytes) : '—'}</td>
          </tr>`;
          }).join('') + '</tbody></table></div>';
        list.querySelectorAll('tr.selectable').forEach(tr => {
          tr.onclick = () => openPipeDrawer(tr.dataset.name);
        });
      }

      const authChip = document.getElementById('pipe-auth-chip');
      if (authChip) authChip.innerHTML = authChipHtml();
    }

    function openPipeDrawer(name) {
      pipeState.selected = name;
      ensurePipeLogs(name, true);
      paintPipelines();
      paintPipeDrawer();
    }

    function closePipeDrawer() {
      pipeState.selected = null;
      paintPipelines();
      paintPipeDrawer();
    }

    function paintPipeDrawer() {
      const host = document.getElementById('pipe-drawer');
      if (!host) return;
      // The sheet repaints on every poll — that is how the log tail and the batch history stay
      // live — so where the reader had scrolled to has to survive the repaint. Panes carry
      // `data-scroll`; one already at the bottom is re-pinned to the new bottom.
      const scroll = capturePipeScroll(host);
      const name = pipeState.selected;
      const p = name ? pipeState.derived.find(x => x.name === name) : null;
      if (!p) { host.innerHTML = ''; return; }
      const b = p.last || {};

      const tiles = [
        ['State', null],
        ['Last batch', p.lastBatchLabel || '—'],
        ['Rows', b.rows != null ? fmt(b.rows) : '—'],
        ['Duration', fmtMs(b.durationMs)],
        ['Rows / s (60 s)', fmtRate(p.rowsPerSec)],
        ['Trigger (observed)', fmtInterval(p.triggerMs)],
        ['Last event', fmtAgo(p.idleMs)],
        ['Log file', fmtBytes(p.sizeBytes)],
      ].map(([k, v]) => `<div class="metric"><div class="eyebrow">${esc(k)}</div><div class="v">${v == null ? chip(p.state) : esc(v)}</div></div>`).join('');

      const slot = p.slot || {};
      const commit = p.commit || {};
      const positions = [
        ['Source', p.source],
        ['Slot', p.slotName],
        ['Confirmed flush LSN', commit.confirmedFlushLsn || slot.confirmedFlushLsn],
        ['Announced to publisher', p.commit ? (commit.sent ? 'yes' : 'no — the slot keeps growing until it is') : null],
        ['Server flush LSN', slot.serverFlushLsn],
        ['Reader position', slot.position],
        ['WAL retained', slot.retainedBytes != null ? fmtBytes(slot.retainedBytes) : null],
        ['Replication lag', slot.lagBytes != null ? fmtBytes(slot.lagBytes) : null],
        ['Snapshot', p.snapshot ? (p.snapshot.table || 'complete') + ' @ ' + (p.snapshot.consistentPoint || '—') : null],
        ['Driver query', p.live ? p.live.id : null],
      ].filter(([, v]) => v != null && v !== '')
        .map(([k, v]) => `<div>${esc(k)}</div><div>${esc(v)}</div>`).join('');

      const history = p.batches.slice().reverse().map(x => `<tr>
        <td class="num">#${x.ordinal}${x.replayed ? ' ↻' : ''}</td>
        <td class="mono truncate" title="${esc((x.startLsn || '—') + ' → ' + (x.endLsn || '—'))}">${esc(x.startLsn || (x.table || '—'))} → ${esc(x.endLsn || '—')}</td>
        <td class="num">${fmt(x.rows)}</td>
        <td class="num">${fmtMs(x.durationMs)}</td>
        <td>${chip(x.kind === 'snapshot' ? 'complete' : 'succeeded', x.kind)} <span class="muted mono">${esc(x.at ? shortTs(x.at) : '')}</span></td>
      </tr>`).join('');

      const warnings = p.warnings.slice(-5).reverse().map(w =>
        `<div>${esc(w.kind)}</div><div>${esc(w.text)}</div>`).join('');

      const err = (p.state === 'error' || p.retrying)
        ? errorState('Pipeline ' + p.name + (p.state === 'error' ? ' has stopped' : ' is retrying a failed batch'),
            pipeLastError(p) || 'No error text is available from this driver.')
        : '';
      host.innerHTML = `<div class="scrim" id="pipe-scrim"></div>
        <aside class="drawer" role="dialog" aria-label="Pipeline ${esc(p.name)}">
          <div class="drawer-head">
            <div>
              <div class="eyebrow">${esc(p.kind)}</div>
              <h3>${esc(p.name)}</h3>
              ${chip(p.state)}
            </div>
            <button class="drawer-close" id="pipe-drawer-close" aria-label="Close">&times;</button>
          </div>
          <div class="drawer-body" data-scroll="body">
            ${err}
            <section><div class="metrics">${tiles}</div></section>
            ${positions ? `<section><span class="eyebrow">Positions</span><div class="kv">${positions}</div></section>` : ''}
            ${warnings ? `<section><span class="eyebrow">Connector warnings</span><div class="kv">${warnings}</div></section>` : ''}
            <section>
              <span class="eyebrow">Batch history</span>
              <div class="card card-flush" style="margin:0">
                <table><thead><tr><th>Batch</th><th>Range</th><th>Rows</th><th>Duration</th><th>Kind</th></tr></thead>
                <tbody>${history || '<tr><td colspan="5" class="muted">No batch or snapshot events in the log tail.</td></tr>'}</tbody></table>
              </div>
              <div class="note">Batch numbers are this page's ordinals over the log tail it holds, not the checkpoint's batch ids: the connector log records LSN ranges, not batch ids, so the list's <strong>Last batch</strong> column shows the newest batch's end LSN (or its timestamp) instead — a number that moves when the pipeline does. <code>↻</code> marks a replayed range. The sink is absent because the connector log does not record one.</div>
            </section>
            ${pipeLogSectionHtml(p)}
          </div>
        </aside>`;
      restorePipeScroll(host, scroll);
      document.getElementById('pipe-drawer-close').onclick = closePipeDrawer;
      document.getElementById('pipe-scrim').onclick = closePipeDrawer;
    }

    function pipeLogSectionHtml(p) {
      const log = pipeState.logs[p.name];
      if (!log) return '';
      if (log.code === 404) {
        return `<section><span class="eyebrow">Connector log</span>
          <div class="note" style="margin:0">The log this pipeline was listed from is gone — rotated, or the pipeline was removed.</div></section>`;
      }
      if (log.code === 401 || log.code === 403) {
        return `<section><span class="eyebrow">Connector log</span>
          <div class="note" style="margin:0">Needs the driver status token — set one at the bottom of the page.</div></section>`;
      }
      if (log.code !== 200) {
        return `<section><span class="eyebrow">Connector log</span>
          <div class="note" style="margin:0">${log.loading && !log.events ? 'Loading&hellip;' : 'Unavailable' + (log.error ? ': ' + esc(log.error) : '')}</div></section>`;
      }
      const events = log.events || [];
      return `<section>
        <span class="eyebrow">Connector log — last ${events.length}</span>
        <div class="logwrap" data-scroll="log">${events.length ? events.map(logLineHtml).join('') : '<div class="logline"><span class="msg">(empty)</span></div>'}</div>
        ${log.truncated || log.malformed ? `<div class="note">${log.truncated ? 'Tail of a larger file. ' : ''}${log.malformed ? log.malformed + ' line(s) were not valid JSON.' : ''}</div>` : ''}
      </section>`;
    }

    /* ---------- Polling ---------- */

    function pipeTick() {
      // The list first: it is what names the logs to tail, and a name that has gone away must
      // stop being polled.
      Promise.all([fetchPipeList(), fetchPipeStatus()]).then(() => {
        const names = (pipeState.list || []).slice(0, PIPE_MAX_TAILED).map(e => e.name);
        const keep = new Set(names);
        if (pipeState.selected) keep.add(pipeState.selected);
        Object.keys(pipeState.logs).forEach(n => { if (!keep.has(n)) delete pipeState.logs[n]; });
        names.forEach(n => ensurePipeLogs(n));
        if (pipeState.selected && !keep.has(pipeState.selected)) pipeState.selected = null;
        paintPipelines();
        paintPipeDrawer();
      });
    }

    function openPipelines() {
      renderPipelines();
      pipeTick();
      if (!pipeState.timer) pipeState.timer = setInterval(pipeTick, PIPE_POLL_MS);
    }

    function stopPipelines() {
      if (pipeState.timer) { clearInterval(pipeState.timer); pipeState.timer = null; }
      // The drawer covers the whole page, so leaving the tab has to take it with us.
      if (pipeState.selected) { pipeState.selected = null; paintPipeDrawer(); }
    }

    // Escape closes the sheet, like every other drawer the platform ships.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && pipeState.selected) closePipeDrawer();
    });

    renderEditor();
    renderNotebook();
    refresh();
    setInterval(refresh, 2000);
    try {
      const es = new EventSource('/api/v1/events/stream');
      es.onmessage = () => refresh();
    } catch (_) {}
  </script>
</body>
</html>
