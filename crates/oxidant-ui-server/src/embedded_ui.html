        pipeState.statusCode = r.status;
        pipeState.status = r.ok ? await r.json() : null;
      } catch (e) {
        pipeState.statusCode = 0;
        pipeState.status = null;
      }
    }

    /* ---------- Derivation, from the connector log ---------- */

    // A /api/status query that is plausibly this pipeline. Secondary: it can confirm "running",
    // it is never the reason a pipeline is on this page.
    function statusQueryFor(name) {
      const qs = (pipeState.status && pipeState.status.queries) || [];
      return qs.find(q => String(q.tag || '').indexOf(name) >= 0) || null;
    }

    // One pipeline, folded out of its log tail. Event shapes are the connector's — see
    // `oxidant-streaming/src/postgres_cdc.rs`, which is where these keys are written.
    function pipeFromLog(entry, log, now) {
      const p = {
        name: entry.name,
        kind: 'connector',
        source: null,
        batches: [],
        warnings: [],
        slot: null,
        commit: null,
        snapshot: null,
        lastError: null,
        lastEventAt: null,
        sizeBytes: entry.sizeBytes,
        logCode: log ? log.code : null,
        logLoading: !!(log && log.loading && !log.events),
      };
      const events = (log && log.code === 200 && log.events) || [];
      // Progress recorded *after* the newest error. Zero means the error is still the last
      // word, which is the difference between "failing" and "hit a bad batch an hour ago".
      let sinceError = 0;
      let replayPending = false;
      let tables = null;
      let slotName = null;

      for (const ev of events) {
        if (!ev || typeof ev !== 'object' || Array.isArray(ev)) continue;
        const kind = String(ev.event || '');
        const at = ev.ts || null;
        if (at) p.lastEventAt = at;
        switch (kind) {
          case 'batch':
            // A `replay: true` line announces a re-read of a range; the batch line that
            // follows is the one with the numbers on it.
            if (ev.replay) { replayPending = true; break; }
            p.batches.push({
              kind: 'batch', at,
              rows: num(ev.rows), durationMs: num(ev.duration_ms),
              startLsn: ev.start_lsn, endLsn: ev.end_lsn, replayed: replayPending,
            });
            replayPending = false;
            sinceError++;
            break;
          case 'snapshot_done':
            p.batches.push({
              kind: 'snapshot', at, table: ev.table,
              rows: num(ev.rows), durationMs: num(ev.duration_ms), endLsn: ev.consistent_point,
            });
            p.snapshot = { table: ev.table, consistentPoint: ev.consistent_point, counted: ev.counted !== false };
            sinceError++;
            break;
          case 'snapshot_start':
            if (Array.isArray(ev.tables) && ev.tables.length) {
              tables = ev.tables.map(t => (t && t.table) || null).filter(Boolean);
            }
            if (ev.slot) slotName = ev.slot;
            // A `reason` on a snapshot_start is a restart the operator did not ask for.
            if (ev.reason) p.warnings.push({ at, kind: 'snapshot restart', text: String(ev.reason) });
            break;
          case 'slot_metrics':
            if (ev.slot) slotName = ev.slot;
            p.slot = {
              at, slot: ev.slot,
              retainedBytes: num(ev.retained_bytes),
              lagBytes: num(ev.lag_bytes),
              serverFlushLsn: ev.server_flush_lsn,
              confirmedFlushLsn: ev.confirmed_flush_lsn,
              position: ev.position,
            };
            break;
          case 'commit':
            p.commit = {
              at, confirmedFlushLsn: ev.confirmed_flush_lsn,
              // `sent: false` means the position was committed locally but never announced to
              // the publisher — the slot keeps growing until it is.
              sent: ev.sent !== false,
              tablesDone: num(ev.snapshot_tables_done),
            };
            sinceError++;
            break;
          case 'schema_change':
          case 'large_transaction':
          case 'value_dropped':
            p.warnings.push({ at, kind: kind.replace(/_/g, ' '), text: String(ev.action || ev.warning || ev.message || kind) });
            break;
          case 'error':
            p.lastError = { at, message: String(ev.message || ev.error || 'error'), willRetry: ev.will_retry !== false };
            sinceError = 0;
            break;
          default:
            // Anything a future connector writes that reads like a failure still lands.
            if (ev.error || /^err|^fatal/i.test(String(ev.level || ev.severity || ''))) {
              p.lastError = { at, message: String(ev.error || ev.message || JSON.stringify(ev)), willRetry: true };
              sinceError = 0;
            }
        }
      }

      // A slot or an introspected table list is what a Postgres CDC connector leaves behind;
      // nothing else in the tree writes either.
      if (slotName || tables) {
        p.kind = 'postgres_cdc';
        // Tables come from `snapshot_start`, which a long-running pipeline's tail has usually
        // rolled past. Then the slot alone names the source — better than a `?` standing in for
        // a list this page never saw.
        p.source = 'PostgresCDC[' +
          [tables && tables.length ? tables.join(', ') : null, slotName ? 'slot=' + slotName : null]
            .filter(Boolean).join(' ') + ']';
        p.slotName = slotName;
        p.tables = tables;
      }

      if (p.batches.length > PIPE_MAX_BATCHES) p.batches = p.batches.slice(-PIPE_MAX_BATCHES);
      // The log records ranges, not batch ids, so the number in the table is this page's
      // ordinal over the tail it holds. The drawer says so.
      p.batches.forEach((b, i) => { b.ordinal = i; });
      p.last = p.batches[p.batches.length - 1] || null;

      const gaps = [];
      for (let i = 1; i < p.batches.length; i++) {
        const g = ts(p.batches[i].at) - ts(p.batches[i - 1].at);
        if (g > 0) gaps.push(g);
      }
      p.triggerMs = gaps.length ? gaps.slice().sort((a, b) => a - b)[Math.floor(gaps.length / 2)] : null;

      const window = p.batches.filter(b => ts(b.at) >= now - PIPE_RATE_WINDOW_MS);
      if (window.length) {
        const rows = window.reduce((a, b) => a + (b.rows || 0), 0);
        // The span the window actually covered, floored at the batches' own runtime so one
        // batch does not divide by ~0 and report an absurd rate.
        const span = Math.max(
          ts(window[window.length - 1].at) - ts(window[0].at),
          window.reduce((a, b) => a + (b.durationMs || 0), 0),
          1000);
        p.rowsPerSec = rows / (span / 1000);
        p.windowRows = rows;
      } else {
        p.rowsPerSec = null;
        p.windowRows = 0;
      }

      // Freshness falls back to the log file's own mtime, which is the same driver clock and
      // is present even when the tail window holds no timestamped event.
      const lastAt = ts(p.lastEventAt) || entry.modifiedMs || 0;
      p.lastEventMs = lastAt || null;
      p.idleMs = lastAt ? Math.max(0, now - lastAt) : null;
      const liveWindow = Math.max(3 * (p.triggerMs || 0), PIPE_MIN_LIVE_MS);
      const fresh = lastAt > 0 && p.idleMs <= liveWindow;

      p.live = statusQueryFor(p.name);
      p.retrying = !!(p.lastError && p.lastError.willRetry && sinceError === 0);
      if (p.lastError && !p.lastError.willRetry && sinceError === 0) p.state = 'error';
      else if (p.live && p.live.state === 'failed') p.state = 'error';
      else if (fresh || (p.live && p.live.state === 'running')) p.state = 'running';
      else p.state = 'idle';

      p.position = (p.commit && p.commit.confirmedFlushLsn) ||
        (p.slot && (p.slot.confirmedFlushLsn || p.slot.position)) ||
        (p.last && p.last.endLsn) || null;
      return p;
    }

    function derivePipelines() {
      const now = Date.now();
      const pipelines = (pipeState.list || [])
        .map(entry => pipeFromLog(entry, pipeState.logs[entry.name], now));
      pipelines.sort((a, b) => (b.lastEventMs || 0) - (a.lastEventMs || 0) || a.name.localeCompare(b.name));
      return pipelines;
    }

    /* ---------- Connector log rendering ---------- */

    function logLineHtml(ev) {
      if (ev == null || typeof ev !== 'object' || Array.isArray(ev)) {
        return `<div class="logline"><span class="msg">${esc(JSON.stringify(ev))}</span></div>`;
      }
      const rest = Object.assign({}, ev);
      const stamp = rest.ts || rest.timestamp || rest.time || '';
      const level = String(rest.level || rest.severity || '').toLowerCase();
      ['ts', 'timestamp', 'time', 'level', 'severity'].forEach(k => delete rest[k]);
      const headline = rest.message || rest.msg || rest.event || rest.error;
      ['message', 'msg', 'event'].forEach(k => delete rest[k]);
      if (headline === rest.error) delete rest.error;
      const extras = Object.keys(rest)
        .map(k => k + '=' + (typeof rest[k] === 'object' ? JSON.stringify(rest[k]) : String(rest[k])))
        .join(' ');
      const text = headline ? (extras ? headline + '  ' + extras : headline) : (extras || JSON.stringify(ev));
      const isError = /^err|^fatal/.test(level) || String(ev.event || '') === 'error';
      const cls = isError ? 'lvl-error' : (/^warn/.test(level) ? 'lvl-warn' : '');
      return `<div class="logline ${cls}"><span class="ts">${esc(shortTs(stamp))}</span><span class="msg">${esc(text)}</span></div>`;
    }

    // The text a failure banner shows. The connector log is the only place the message exists.
    function pipeLastError(p) {
      if (p.lastError) {
        return p.lastError.message + (p.lastError.willRetry
          ? '\n\nThe connector marked this retryable and nothing has progressed since, so the batch is still being retried.'
          : '\n\nThe connector marked this fatal: the pipeline has stopped rather than skip data.');
      }
      if (p.live && p.live.state === 'failed') return 'The driver reports this query as failed (' + p.live.id + ').';
      return null;
    }

    /* ---------- Rendering ---------- */

    function pipeVisible() {
      const el = document.getElementById('panel-pipelines');
      return el && !el.classList.contains('hidden');
    }

    function renderPipelines() {
      const el = document.getElementById('panel-pipelines');
      if (el.dataset.ready) return;
      el.dataset.ready = '1';
      el.innerHTML = `
        <div class="card">
          ${cardHead('Streaming', 'Pipelines', '<span class="note" style="margin:0" id="pipe-freshness"></span>')}
          <div class="metrics" id="pipe-metrics"></div>
          <div class="note">
            Read from each connector's own JSONL log, not from the execution store: a streaming
            micro-batch is never registered with the observability store, so the
            <strong>Jobs</strong>, <strong>Stages</strong> and <strong>SQL</strong> pages hold no
            streaming work and never will until a per-batch observer is wired into the streaming
            query manager. Everything on this page is a connector event, plus
            <code>/api/status</code> as a cross-check.
          </div>
        </div>
        <div id="pipe-banner"></div>
        <div id="pipe-list"></div>
        <div class="card">
          ${cardHead('Access', 'Driver status token', '<span id="pipe-auth-chip"></span>')}
          <div class="note" style="margin-top:0">
            Required, not optional: <code>/api/v1/pipelines</code>,
            <code>/api/v1/pipelines/&hellip;/logs</code> and <code>/api/status</code> are all gated
            behind <code>OXIDANT_STATUS_TOKEN</code>, and they are this page's only sources. The
            token is kept in this browser only, and is sent to this driver only.
          </div>
          <div class="flex" style="flex-wrap:wrap">
            <input type="password" id="pipe-token" placeholder="OXIDANT_STATUS_TOKEN" autocomplete="off" spellcheck="false" />
            <button class="btn" id="pipe-token-save">Use</button>
            <button class="btn-secondary" id="pipe-token-clear">Clear</button>
          </div>
        </div>`;
      const input = document.getElementById('pipe-token');
      input.value = pipeState.token;
      document.getElementById('pipe-token-save').onclick = () => {
        pipeState.token = input.value.trim();
        try { localStorage.setItem(PIPE_TOKEN_KEY, pipeState.token); } catch (e) {}
        pipeState.logs = {};
        pipeTick();
      };
      document.getElementById('pipe-token-clear').onclick = () => {
        pipeState.token = '';
        input.value = '';
        try { localStorage.removeItem(PIPE_TOKEN_KEY); } catch (e) {}
        pipeState.status = null;
        pipeState.statusCode = null;
        pipeState.list = null;
        pipeState.listCode = null;
        pipeState.logs = {};
        paintPipelines();
        paintPipeDrawer();
      };
      paintPipelines();
    }

    function authChipHtml() {
      if (!pipeState.token) return chip('idle', 'no token');
      const code = pipeState.listCode != null ? pipeState.listCode : pipeState.statusCode;
      if (code === 200) return chip('ok', 'authorized');
      if (code === 401 || code === 403) return chip('failed', 'rejected');
      if (code === 404) return chip('idle', 'no connector logs');
      if (code == null) return chip('pending', 'not polled');
      return chip('failed', 'error ' + code);
    }

    // Why the list is empty, in the words of the thing that made it empty.
    function pipeEmptyStateHtml() {
      if (!pipeState.token) {
        return emptyState('This page needs the driver status token',
          'Every source it reads — the pipeline list, the connector logs, /api/status — is gated behind OXIDANT_STATUS_TOKEN. Paste it below.');
      }
      if (pipeState.listCode === 401 || pipeState.listCode === 403) {
        return emptyState('That token was rejected',
          'The driver answered 401. Check OXIDANT_STATUS_TOKEN on the server.');
      }
      if (pipeState.listCode === 404) {
        return emptyState('This driver serves no connector logs',
          'GET /api/v1/pipelines answers 404 when OXIDANT_STATUS_TOKEN is unset, when OXIDANT_CHECKPOINT_DIR is unset, or when its logs/ directory does not exist yet — the directory appears when the first connector starts. Set OXIDANT_CHECKPOINT_DIR to the same path as pipeline.checkpoints in oxidant.yaml.');
      }
      if (pipeState.listCode == null) return emptyState('Not polled yet');
      if (pipeState.listCode !== 200) {
        return errorState('Could not list pipelines', 'GET /api/v1/pipelines answered ' + pipeState.listCode + '.');
      }
      return emptyState('No streaming pipeline has written a connector log yet',
        'A pipeline appears here on its first logged event — slot metrics, a snapshot, or a batch. Note that a query started through Spark Connect readStream() has no checkpoint root to log under, so it will not appear; a pipeline declared in oxidant.yaml will.');
    }

    function paintPipelines() {
      const panel = document.getElementById('panel-pipelines');
      // A fetch can land after the reader has moved on; repainting a hidden table is wasted
      // work on a page that also repaints every 2 s.
      if (!panel || !panel.dataset.ready || !pipeVisible()) return;
      const pipelines = derivePipelines();
      pipeState.derived = pipelines;

      const running = pipelines.filter(p => p.state === 'running').length;
      const troubled = pipelines.filter(p => p.state === 'error' || p.retrying);
      const rate = pipelines.reduce((a, p) => a + (p.rowsPerSec || 0), 0);
      const rows = pipelines.reduce((a, p) => a + (p.windowRows || 0), 0);
      const retained = pipelines.reduce((a, p) => Math.max(a, (p.slot && p.slot.retainedBytes) || 0), 0);
      const lag = pipelines.reduce((a, p) => Math.max(a, (p.slot && p.slot.lagBytes) || 0), 0);
      const anySlot = pipelines.some(p => p.slot);
      document.getElementById('pipe-metrics').innerHTML = [
        ['Pipelines', String(pipelines.length)],
        ['Running', String(running)],
        ['Rows / s (60 s)', pipelines.length ? fmtRate(rate) : '—'],
        ['Rows (60 s)', pipelines.length ? rows.toLocaleString() : '—'],
        ['WAL retained (max)', anySlot ? fmtBytes(retained) : '—'],
        ['Replication lag (max)', anySlot ? fmtBytes(lag) : '—'],
      ].map(([k, v]) => `<div class="metric"><div class="eyebrow">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('');

      const newest = pipelines.length ? pipelines[0].lastEventMs : null;
      const tailed = Math.min(pipelines.length, PIPE_MAX_TAILED);
      document.getElementById('pipe-freshness').textContent =
        (newest ? 'newest event ' + new Date(newest).toISOString().slice(11, 19) + ' UTC' : 'no events seen') +
        ' · polling every ' + (PIPE_POLL_MS / 1000) + ' s' +
        (pipelines.length > tailed ? ' · tailing the ' + tailed + ' most recent of ' + pipelines.length : '') +
        (pipeState.listTruncated ? ' · the driver truncated its pipeline list' : '');

      // An error is louder than the chip in its row: the newest troubled pipeline gets a banner.
      const banner = document.getElementById('pipe-banner');
      if (troubled.length) {
        const p = troubled[0];
        const verb = p.state === 'error' ? 'has stopped' : 'is retrying a failed batch';
        banner.innerHTML = errorState(
          troubled.length > 1 ? troubled.length + ' pipelines need attention — ' + p.name : p.name + ' ' + verb,
          pipeLastError(p) || 'No error text is available from this driver.');
      } else {
        banner.innerHTML = '';
      }

      const list = document.getElementById('pipe-list');
      if (!pipelines.length) {
        list.innerHTML = pipeEmptyStateHtml();
      } else {
        list.innerHTML = '<div class="card card-flush">' +
          cardHead('Live', 'Streaming pipelines', '<span class="note" style="margin:0">click a row for batch history and the connector log</span>') +
          '<table><thead><tr><th>Pipeline</th><th>Source</th><th>State</th><th>Trigger</th><th>Last batch</th><th>Rows</th><th>Duration</th><th>Rows / s</th><th>Confirmed LSN</th><th>WAL retained</th></tr></thead><tbody>' +
          pipelines.map(p => {
            const b = p.last;
            return `<tr class="selectable ${pipeState.selected === p.name ? 'selected' : ''}" data-name="${esc(p.name)}">
            <td>${esc(p.name)}</td>
            <td class="mono truncate" title="${esc(p.source || 'the connector log does not name its source')}">${esc(p.source || '—')}</td>
            <td>${chip(p.state)}${p.retrying && p.state !== 'error' ? ' ' + chip('pending', 'retrying') : ''}</td>
            <td class="num" title="observed: median gap between batch starts">${fmtInterval(p.triggerMs)}</td>
            <td class="num" title="${esc(b && b.at ? b.at : 'no batch in the log tail')}">${b ? '#' + b.ordinal + (b.kind === 'snapshot' ? ' snap' : '') : '—'}</td>
            <td class="num">${b ? fmt(b.rows) : '—'}</td>
            <td class="num">${b ? fmtMs(b.durationMs) : '—'}</td>
            <td class="num" title="observed: rows in the last 60 s over the span they covered">${fmtRate(p.rowsPerSec)}</td>
            <td class="mono truncate" title="${esc(p.position || '')}">${esc(p.position || '—')}</td>
            <td class="num">${p.slot ? fmtBytes(p.slot.retainedBytes) : '—'}</td>
          </tr>`;
          }).join('') + '</tbody></table></div>';
        list.querySelectorAll('tr.selectable').forEach(tr => {
          tr.onclick = () => openPipeDrawer(tr.dataset.name);
        });
      }

      const authChip = document.getElementById('pipe-auth-chip');
      if (authChip) authChip.innerHTML = authChipHtml();
    }

    function openPipeDrawer(name) {
      pipeState.selected = name;
      ensurePipeLogs(name, true);
      paintPipelines();
      paintPipeDrawer();
    }

    function closePipeDrawer() {
      pipeState.selected = null;
      paintPipelines();
      paintPipeDrawer();
    }

    function paintPipeDrawer() {
      const host = document.getElementById('pipe-drawer');
      if (!host) return;
      const name = pipeState.selected;
      const p = name ? pipeState.derived.find(x => x.name === name) : null;
      if (!p) { host.innerHTML = ''; return; }
      const b = p.last || {};

      const tiles = [
        ['State', null],
        ['Last batch', p.last ? '#' + b.ordinal : '—'],
        ['Rows', b.rows != null ? fmt(b.rows) : '—'],
        ['Duration', fmtMs(b.durationMs)],
        ['Rows / s (60 s)', fmtRate(p.rowsPerSec)],
        ['Trigger (observed)', fmtInterval(p.triggerMs)],
        ['Last event', fmtAgo(p.idleMs)],
        ['Log file', fmtBytes(p.sizeBytes)],
      ].map(([k, v]) => `<div class="metric"><div class="eyebrow">${esc(k)}</div><div class="v">${v == null ? chip(p.state) : esc(v)}</div></div>`).join('');

      const slot = p.slot || {};
      const commit = p.commit || {};
      const positions = [
        ['Source', p.source],
        ['Slot', p.slotName],
        ['Confirmed flush LSN', commit.confirmedFlushLsn || slot.confirmedFlushLsn],
        ['Announced to publisher', p.commit ? (commit.sent ? 'yes' : 'no — the slot keeps growing until it is') : null],
        ['Server flush LSN', slot.serverFlushLsn],
        ['Reader position', slot.position],
        ['WAL retained', slot.retainedBytes != null ? fmtBytes(slot.retainedBytes) : null],
        ['Replication lag', slot.lagBytes != null ? fmtBytes(slot.lagBytes) : null],
        ['Snapshot', p.snapshot ? (p.snapshot.table || 'complete') + ' @ ' + (p.snapshot.consistentPoint || '—') : null],
        ['Driver query', p.live ? p.live.id : null],
      ].filter(([, v]) => v != null && v !== '')
        .map(([k, v]) => `<div>${esc(k)}</div><div>${esc(v)}</div>`).join('');

      const history = p.batches.slice().reverse().map(x => `<tr>
        <td class="num">#${x.ordinal}${x.replayed ? ' ↻' : ''}</td>
        <td class="mono truncate" title="${esc((x.startLsn || '—') + ' → ' + (x.endLsn || '—'))}">${esc(x.startLsn || (x.table || '—'))} → ${esc(x.endLsn || '—')}</td>
        <td class="num">${fmt(x.rows)}</td>
        <td class="num">${fmtMs(x.durationMs)}</td>
        <td>${chip(x.kind === 'snapshot' ? 'complete' : 'succeeded', x.kind)} <span class="muted mono">${esc(x.at ? shortTs(x.at) : '')}</span></td>
      </tr>`).join('');

      const warnings = p.warnings.slice(-5).reverse().map(w =>
        `<div>${esc(w.kind)}</div><div>${esc(w.text)}</div>`).join('');

      const err = (p.state === 'error' || p.retrying)
        ? errorState('Pipeline ' + p.name + (p.state === 'error' ? ' has stopped' : ' is retrying a failed batch'),
            pipeLastError(p) || 'No error text is available from this driver.')
        : '';
      host.innerHTML = `<div class="scrim" id="pipe-scrim"></div>
        <aside class="drawer" role="dialog" aria-label="Pipeline ${esc(p.name)}">
          <div class="drawer-head">
            <div>
              <div class="eyebrow">${esc(p.kind)}</div>
              <h3>${esc(p.name)}</h3>
              ${chip(p.state)}
            </div>
            <button class="drawer-close" id="pipe-drawer-close" aria-label="Close">&times;</button>
          </div>
          <div class="drawer-body">
            ${err}
            <section><div class="metrics">${tiles}</div></section>
            ${positions ? `<section><span class="eyebrow">Positions</span><div class="kv">${positions}</div></section>` : ''}
            ${warnings ? `<section><span class="eyebrow">Connector warnings</span><div class="kv">${warnings}</div></section>` : ''}
            <section>
              <span class="eyebrow">Batch history</span>
              <div class="card card-flush" style="margin:0">
                <table><thead><tr><th>Batch</th><th>Range</th><th>Rows</th><th>Duration</th><th>Kind</th></tr></thead>
                <tbody>${history || '<tr><td colspan="5" class="muted">No batch or snapshot events in the log tail.</td></tr>'}</tbody></table>
              </div>
              <div class="note">Batch numbers are this page's ordinals over the log tail it holds, not the checkpoint's batch ids: the connector log records LSN ranges, not batch ids. <code>↻</code> marks a replayed range. The sink is absent because the connector log does not record one.</div>
            </section>
            ${pipeLogSectionHtml(p)}
          </div>
        </aside>`;
      document.getElementById('pipe-drawer-close').onclick = closePipeDrawer;
      document.getElementById('pipe-scrim').onclick = closePipeDrawer;
    }

    function pipeLogSectionHtml(p) {
      const log = pipeState.logs[p.name];
      if (!log) return '';
      if (log.code === 404) {
        return `<section><span class="eyebrow">Connector log</span>
          <div class="note" style="margin:0">The log this pipeline was listed from is gone — rotated, or the pipeline was removed.</div></section>`;
      }
      if (log.code === 401 || log.code === 403) {
        return `<section><span class="eyebrow">Connector log</span>
          <div class="note" style="margin:0">Needs the driver status token — set one at the bottom of the page.</div></section>`;
      }
      if (log.code !== 200) {
        return `<section><span class="eyebrow">Connector log</span>
          <div class="note" style="margin:0">${log.loading && !log.events ? 'Loading&hellip;' : 'Unavailable' + (log.error ? ': ' + esc(log.error) : '')}</div></section>`;
      }
      const events = log.events || [];
      return `<section>
        <span class="eyebrow">Connector log — last ${events.length}</span>
        <div class="logwrap">${events.length ? events.map(logLineHtml).join('') : '<div class="logline"><span class="msg">(empty)</span></div>'}</div>
        ${log.truncated || log.malformed ? `<div class="note">${log.truncated ? 'Tail of a larger file. ' : ''}${log.malformed ? log.malformed + ' line(s) were not valid JSON.' : ''}</div>` : ''}
      </section>`;
    }

    /* ---------- Polling ---------- */

    function pipeTick() {
      // The list first: it is what names the logs to tail, and a name that has gone away must
      // stop being polled.
      Promise.all([fetchPipeList(), fetchPipeStatus()]).then(() => {
        const names = (pipeState.list || []).slice(0, PIPE_MAX_TAILED).map(e => e.name);
        const keep = new Set(names);
        if (pipeState.selected) keep.add(pipeState.selected);
        Object.keys(pipeState.logs).forEach(n => { if (!keep.has(n)) delete pipeState.logs[n]; });
        names.forEach(n => ensurePipeLogs(n));
        if (pipeState.selected && !keep.has(pipeState.selected)) pipeState.selected = null;
        paintPipelines();
        paintPipeDrawer();
      });
    }

    function openPipelines() {
      renderPipelines();
      pipeTick();
      if (!pipeState.timer) pipeState.timer = setInterval(pipeTick, PIPE_POLL_MS);
    }

    function stopPipelines() {
      if (pipeState.timer) { clearInterval(pipeState.timer); pipeState.timer = null; }
      // The drawer covers the whole page, so leaving the tab has to take it with us.
      if (pipeState.selected) { pipeState.selected = null; paintPipeDrawer(); }
    }

    // Escape closes the sheet, like every other drawer the platform ships.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && pipeState.selected) closePipeDrawer();
    });

    renderEditor();
    renderNotebook();
    refresh();
    setInterval(refresh, 2000);
    try {
      const es = new EventSource('/api/v1/events/stream');
      es.onmessage = () => refresh();
    } catch (_) {}
  </script>
</body>
</html>
