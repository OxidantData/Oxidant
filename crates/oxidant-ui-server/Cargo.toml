[package]
name = "oxidant-ui-server"
description = "Spark-compatible REST API and embedded monitoring UI for Oxidant."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
oxidant-common = { workspace = true }
oxidant-observability = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Constant-time secret comparison for the `/api/status` bearer token.
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = "0.3"
tracing = "0.1"
# Server-generated dashboard ids (also the on-disk filename).
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"
