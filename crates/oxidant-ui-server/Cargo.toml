[package]
name = "oxidant-ui-server"
description = "Spark-compatible REST API and embedded monitoring UI for Oxidant."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
oxidant-common = { workspace = true }
oxidant-observability = { workspace = true }
# The connector-log routes read what the streaming engine wrote. Taken as a dependency rather
# than reimplemented so the checkpoint root is resolved by the *same* function the pipeline
# resolves it with (`oxidant_streaming::checkpoint_store`) and the log's key layout has one
# definition: a server that resolved `s3://` its own way is a server that reads a different
# bucket than the driver writes.
oxidant-streaming = { workspace = true }
# `/api/v1/pipelines/lifecycle` reads a pipeline's own `pipeline.checkpoints` root and declared
# table names off disk before acting on them — the caller's word for either is checked against
# this, never substituted for it. Same parser `oxidant pipeline run` uses.
oxidant-config = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Constant-time secret comparison for the `/api/status` bearer token.
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures = "0.3"
tracing = "0.1"
# Server-generated dashboard ids (also the on-disk filename).
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"
# `tests/minio_pipeline_logs.rs` writes the log objects the routes then read back.
serde_json = "1"
oxidant-observability = { workspace = true }
