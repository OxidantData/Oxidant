[package]
name = "oxidant-bench"
description = "Engine-direct + live-server benchmark harness: ClickBench, TPC-H, and TPC-DS through oxidant-loom / oxidant-connect."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxidant-bench"
path = "src/main.rs"

[dependencies]
oxidant-loom = { workspace = true }
oxidant-connect = { workspace = true }
oxidant-execution = { workspace = true }
oxidant-proto = { workspace = true }
datafusion = "54"
tonic = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tpchgen = "2"
# sample-data generator: writes relocatable Iceberg v2 metadata (manifests + table metadata)
# over the local filesystem — same pinned version/features as oxidant-datasource reads with.
iceberg = { version = "=0.8.0", default-features = false, features = ["storage-fs"] }
