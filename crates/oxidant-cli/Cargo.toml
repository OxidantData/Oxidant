[package]
name = "oxidant-cli"
description = "The `oxidant` binary: launches the Spark Connect server and dev utilities."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxidant"
path = "src/main.rs"

[dependencies]
oxidant-common = { workspace = true }
oxidant-config = { workspace = true }
oxidant-pipelines = { workspace = true }
oxidant-connect = { workspace = true }
oxidant-loom = { workspace = true }
# Enable DNS worker discovery (`OXIDANT_WORKER_SERVICE`) the same way oxidant-connect
# does — required for EC2 ASG / Route53 multi-A membership (Spark EMR-style cores).
oxidant-execution = { workspace = true, features = ["k8s"] }
oxidant-ui-server = { workspace = true }
oxidant-observability = { workspace = true }
# `time` (statement polling), `io-std`/`io-util` (the `mcp` stdio JSON-RPC stream).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util"] }
# `sql`/`mcp` talk to the REST statement API (`oxidant-connect::rest`) over HTTP.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Rendering a reconcile schedule's next firing, in the same RFC 3339 shape it is stored in.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# One durable line per entry point: `run_worker` announces itself through `tracing` so the
# announcement lands in `logs/oxidant.log` and not only on stderr (§6c).
tracing = "0.1"
# TODO(deps): clap = { version = "4", features = ["derive"] } for real subcommand parsing.

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
datafusion = "54"
# Mock statements-API server for `client`/`mcp` unit tests.
axum = "0.8"
serde = { version = "1", features = ["derive"] }
