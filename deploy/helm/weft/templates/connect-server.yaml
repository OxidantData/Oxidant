{{- if .Values.connect.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weft-connect
  labels:
    app: weft-connect
spec:
  replicas: {{ .Values.connect.replicas }}
  selector:
    matchLabels:
      app: weft-connect
  template:
    metadata:
      labels:
        app: weft-connect
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.connect.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connect.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.connect.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: connect
          image: {{ .Values.connect.image }}
          imagePullPolicy: {{ .Values.connect.imagePullPolicy }}
          args: ["spark", "server", "--port", "{{ .Values.connect.port }}"]
          ports:
            - name: spark-connect
              containerPort: {{ .Values.connect.port }}
          env:
            - name: WEFT_WORKER_SERVICE
              value: {{ printf "weft-worker.%s.svc.cluster.local" .Release.Namespace | quote }}
            - name: WEFT_WORKER_PORT
              value: {{ .Values.worker.port | quote }}
            - name: WEFT_AWS_BIN
              value: {{ .Values.connect.awsBin | quote }}
            # Threshold spill under temp_dir()/weft-shuffle-spill — point TMPDIR at the
            # spill volume. Never set WEFT_SHUFFLE_SPILL_DIR unless forceShuffleSpill.
            - name: TMPDIR
              value: /var/lib/weft/spill
            - name: HOME
              value: /tmp
            {{- if .Values.connect.shuffleSpillBytes }}
            - name: WEFT_SHUFFLE_SPILL_BYTES
              value: {{ .Values.connect.shuffleSpillBytes | quote }}
            {{- end }}
            {{- if .Values.connect.distributedStrict }}
            - name: WEFT_DISTRIBUTED_STRICT
              value: "1"
            {{- end }}
            {{- if .Values.connect.memoryLimitBytes }}
            - name: WEFT_MEMORY_LIMIT_BYTES
              value: {{ .Values.connect.memoryLimitBytes | quote }}
            {{- end }}
            {{- if .Values.connect.forceShuffleSpill }}
            - name: WEFT_SHUFFLE_SPILL_DIR
              value: /var/lib/weft/spill
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: spark-connect
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: spark-connect
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spill
              mountPath: /var/lib/weft/spill
          resources:
            {{- toYaml .Values.connect.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spill
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: weft-connect
  labels:
    app: weft-connect
spec:
  type: {{ .Values.connect.serviceType }}
  selector:
    app: weft-connect
  ports:
    - name: spark-connect
      port: {{ .Values.connect.port }}
      targetPort: {{ .Values.connect.port }}
{{- end }}
