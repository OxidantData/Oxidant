# Operator topology for TPC-DS / TPC-H SF100 on EKS (arm64 / Graviton).
#
# Target hardware (provision outside this chart — placeholders below):
#   driver / connect: 1x c6g.xlarge  (4 vCPU / 8 GiB)  + ~100 GiB EBS
#   workers:          2x m8g.4xlarge (16 vCPU / 64 GiB) + 500 GiB gp3 each
#   replicas pinned at 2 (min=max=2); autoscaling MUST stay false.
#
# Fill IRSA / storage class with real cluster values before install.
#
# MEMORY INVARIANT (two separate pools — do NOT set them equal to the limit):
#   memoryLimitBytes     → DataFusion bounded spill pool (joins/sorts/aggs)
#   shuffleSpillBytes    → SpillStore shuffle-bucket cache threshold (separate Vec)
#   memoryLimitBytes + shuffleSpillBytes + headroom <= container memory limit
# Headroom covers Arrow decode buffers, object-store/S3 client, the AWS CLI
# subprocess Glue shells out to, and allocator fragmentation. Overlapping the
# two budgets at ~limit each will OOMKill the pod before either threshold trips.

serviceAccount:
  create: true
  name: weft
  annotations:
    # REPLACE: real account + role used for S3 + Glue IRSA
    eks.amazonaws.com/role-arn: "arn:aws:iam::AWS_ACCOUNT_ID:role/WEFT_IRSA_ROLE_NAME"

connect:
  enabled: true
  distributedStrict: true
  forceShuffleSpill: false
  # 7Gi limit: ~3 Gi DF + ~1.5 Gi shuffle + ~2.5 Gi headroom.
  memoryLimitBytes: "3221225472"   # 3 Gi — DataFusion pool
  shuffleSpillBytes: "1610612736"  # 1.5 Gi — shuffle cache threshold
  resources:
    requests:
      # c6g.xlarge ≈ 3920m allocatable; leave ~900m for CNI / kube-proxy / agents.
      cpu: "3000m"
      memory: 7Gi
    limits:
      cpu: "4"
      memory: 7Gi
  nodeSelector:
    kubernetes.io/arch: arm64
    # REPLACE: node group / capacity type labels for the c6g.xlarge pool
    # node.kubernetes.io/instance-type: c6g.xlarge

worker:
  replicas: 2
  autoscaling:
    enabled: false
  forceShuffleSpill: false
  # 56Gi limit: ~26 Gi DF + ~14 Gi shuffle + ~16 Gi headroom.
  memoryLimitBytes: "27917287424"  # 26 Gi — DataFusion pool
  shuffleSpillBytes: "15032385536" # 14 Gi — shuffle cache threshold
  resources:
    requests:
      cpu: "14"
      memory: 56Gi
    limits:
      cpu: "16"
      memory: 56Gi
  nodeSelector:
    kubernetes.io/arch: arm64
    # REPLACE: node group / capacity type labels for the m8g.4xlarge pool
    # node.kubernetes.io/instance-type: m8g.4xlarge
  persistence:
    enabled: true
    # REPLACE: cluster gp3 StorageClass name (often "gp3")
    storageClass: "gp3"
    size: 500Gi
    accessModes:
      - ReadWriteOnce
