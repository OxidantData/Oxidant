# Operator topology for TPC-DS / TPC-H SF100 on EKS (arm64 / Graviton).
#
# Target hardware (provision outside this chart — placeholders below).
# CANONICAL — keep in sync with docs/distributed-ec2.md § "SF100 topology"
# (EC2 CloudFormation uses the same instance shapes for honesty runs):
#   driver / connect: 1x c6g.xlarge  (4 vCPU / 8 GiB)  + 100 GiB gp3 root
#   workers:          2x m8g.8xlarge (32 vCPU / 128 GiB) + 500 GiB gp3 spill each
#   replicas pinned at 2 (min=max=2); autoscaling MUST stay false.
#   KAN-14 rerun: m8g.4xlarge (64 GiB) is UNDER-PROVISIONED — DataFusion 54 HashJoin is
#   not spillable, so every multi-fact SF100 TPC-H join OOM'd the 64 GiB worker cgroup.
#   Use m8g.8xlarge + OXIDANT_SHUFFLE_PARTITIONS ~= worker vCPU (see distributed-ec2.md).
#
# Fill IRSA / storage class with real cluster values before install.
#
# MEMORY INVARIANT (two separate pools — do NOT set them equal to the limit):
#   memoryLimitBytes     → DataFusion bounded spill pool (joins/sorts/aggs)
#   shuffleSpillBytes    → SpillStore shuffle-bucket cache threshold (separate Vec)
#   memoryLimitBytes + shuffleSpillBytes + headroom <= container memory limit
#   container memory limit <= node ALLOCATABLE (not capacity)
# EKS kube-reserved is significant: ~2.05 GiB on an 8 GiB node (allocatable ~5.85 GiB)
# and ~5.7 GiB on a 64 GiB node (allocatable ~58.2 GiB). Sizing against capacity
# instead of allocatable leaves the pod Pending, which looks like a cluster problem
# rather than a values bug. Verify with `kubectl describe node | grep -A5 Allocatable`.
# Headroom covers Arrow decode buffers, object-store/S3 client, the AWS CLI
# subprocess Glue shells out to, and allocator fragmentation. Overlapping the
# two budgets at ~limit each will OOMKill the pod before either threshold trips.

serviceAccount:
  create: true
  name: oxidant
  annotations:
    # REPLACE: real account + role used for S3 + Glue IRSA
    eks.amazonaws.com/role-arn: "arn:aws:iam::AWS_ACCOUNT_ID:role/OXIDANT_IRSA_ROLE_NAME"

connect:
  enabled: true
  distributedStrict: true
  forceShuffleSpill: false
  # 5Gi limit: ~2 Gi DF + ~1 Gi shuffle + ~2 Gi headroom.
  memoryLimitBytes: "2147483648"   # 2 Gi — DataFusion pool
  shuffleSpillBytes: "1073741824"  # 1 Gi — shuffle cache threshold
  resources:
    requests:
      # c6g.xlarge ≈ 3920m allocatable; leave ~900m for CNI / kube-proxy / agents.
      cpu: "3000m"
      # Memory must fit ALLOCATABLE, not capacity. EKS kube-reserved on an 8 GiB node
      # is ~2.05 GiB, so allocatable is only ~5.85 GiB — a 7Gi request leaves the pod
      # Pending forever with "Insufficient memory". Do not raise this without
      # recomputing against the node's real `kubectl describe node` allocatable.
      memory: 5Gi
    limits:
      cpu: "4"
      memory: 5Gi
  nodeSelector:
    kubernetes.io/arch: arm64
    # REPLACE: node group / capacity type labels for the c6g.xlarge pool
    # node.kubernetes.io/instance-type: c6g.xlarge

worker:
  replicas: 2
  autoscaling:
    enabled: false
  forceShuffleSpill: false
  # KAN-7: leave more cgroup headroom than DF+shuffle alone. HashJoin / Arrow / S3 / aws-cli
  # RSS sits outside FairSpillPool; 26+14 left only ~16 Gi of 56 Gi and still OOMKilled on SF100.
  # KAN-14: bumped to 40 Gi for m8g.8xlarge (128 GiB) — HashJoin build side is NOT spillable,
  # so 20 Gi pool on 64 GiB OOM'd every multi-fact SF100 join. 40 Gi DF + 8 Gi shuffle = 48 Gi
  # tracked → ~80 Gi native headroom under a ~112 Gi cgroup ceiling on 128 GiB.
  memoryLimitBytes: "42949672960"  # 40 Gi — DataFusion spill pool
  shuffleSpillBytes: "8589934592"  # 8 Gi — shuffle cache threshold
  # Shuffle fan-out (driver-side): set ~= worker vCPU (e.g. 32 on m8g.8xlarge), NOT the
  # default worker-count (=2), to spread the hash shuffle and avoid 2-bucket skew. This is
  # an env on the connect/driver pod: OXIDANT_SHUFFLE_PARTITIONS=32.
  # DataFusion 54 HashJoinInput is not spillable. At SF100, prefer sort-merge joins so bounded-pool
  # pressure spills sort/join buffers to the gp3 PVC instead of failing Resources exhausted.
  preferHashJoin: false
  resources:
    requests:
      cpu: "14"
      memory: 56Gi
    limits:
      cpu: "16"
      memory: 56Gi
  nodeSelector:
    kubernetes.io/arch: arm64
    # REPLACE: node group / capacity type labels for the m8g.4xlarge pool
    # node.kubernetes.io/instance-type: m8g.4xlarge
  persistence:
    enabled: true
    # REPLACE: cluster gp3 StorageClass name (often "gp3")
    storageClass: "gp3"
    size: 500Gi
    accessModes:
      - ReadWriteOnce
