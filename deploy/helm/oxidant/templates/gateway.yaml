{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxidant-gateway
  labels:
    app: oxidant-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: oxidant-gateway
  template:
    metadata:
      labels:
        app: oxidant-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
          env:
            - name: OXIDANT_GATEWAY_PORT
              value: "{{ .Values.gateway.port }}"
            - name: OXIDANT_ORCHESTRATOR
              value: {{ .Values.gateway.env.OXIDANT_ORCHESTRATOR | quote }}
            - name: OXIDANT_WORKER_IMAGE
              value: {{ .Values.gateway.env.OXIDANT_WORKER_IMAGE | quote }}
            - name: OXIDANT_CLUSTER_IMAGE
              value: {{ .Values.gateway.env.OXIDANT_CLUSTER_IMAGE | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: oxidant-gateway
spec:
  selector:
    app: oxidant-gateway
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
{{- end }}
