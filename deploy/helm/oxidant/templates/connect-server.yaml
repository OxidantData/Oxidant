{{- if .Values.connect.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxidant-connect
  labels:
    app: oxidant-connect
spec:
  replicas: {{ .Values.connect.replicas }}
  selector:
    matchLabels:
      app: oxidant-connect
  template:
    metadata:
      labels:
        app: oxidant-connect
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.connect.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        # Keep the driver off the worker nodes. The SF100 topology claims a dedicated
        # driver instance; without this the scheduler is free to co-locate connect with
        # a worker (the instance-type nodeSelector is a commented-out placeholder, so
        # arch is the only other constraint) and the worker loses CPU and memory to it.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: oxidant-worker
              topologyKey: kubernetes.io/hostname
        {{- with .Values.connect.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.connect.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: connect
          image: {{ .Values.connect.image }}
          imagePullPolicy: {{ .Values.connect.imagePullPolicy }}
          args: ["spark", "server", "--port", "{{ .Values.connect.port }}"]
          ports:
            - name: spark-connect
              containerPort: {{ .Values.connect.port }}
          env:
            - name: OXIDANT_WORKER_SERVICE
              value: {{ printf "oxidant-worker.%s.svc.cluster.local" .Release.Namespace | quote }}
            - name: OXIDANT_WORKER_PORT
              value: {{ .Values.worker.port | quote }}
            - name: OXIDANT_AWS_BIN
              value: {{ .Values.connect.awsBin | quote }}
            # The driver cross-checks its visible worker fan-out against this and hard-fails
            # on mismatch, so a not-Ready worker aborts the query instead of returning the
            # surviving shards as if they were the whole table.
            #
            # Safe to set here WITHOUT OXIDANT_POD_NAME / OXIDANT_SHARD_INDEX: ShardAssignment::from_env
            # needs a shard *index* as well as a count and returns None without one, so the
            # driver never starts sharding its own reads. Do not add a pod-name env here.
            - name: OXIDANT_WORKER_COUNT
              value: {{ .Values.worker.replicas | quote }}
            # Pin the shuffle modulus. Unset, shuffle_partitions() falls back to the LIVE
            # worker count, and refresh_cluster_workers() recomputes it between stages of a
            # single query. A worker that briefly leaves the headless Service (restart, OOM
            # kill, failed readiness probe) therefore shrinks the modulus mid-flight: rows
            # that producers hashed into the now-out-of-range buckets are never pulled by
            # any consumer, so the query returns FEWER ROWS, FASTER, with no error. Pinning
            # keeps the modulus constant no matter what DNS reports.
            - name: OXIDANT_SHUFFLE_PARTITIONS
              value: {{ (.Values.connect.shufflePartitions | default .Values.worker.replicas) | quote }}
            # Threshold spill under temp_dir()/oxidant-shuffle-spill — point TMPDIR at the
            # spill volume. Never set OXIDANT_SHUFFLE_SPILL_DIR unless forceShuffleSpill.
            - name: TMPDIR
              value: /var/lib/oxidant/spill
            - name: HOME
              value: /tmp
            {{- if .Values.connect.shuffleSpillBytes }}
            - name: OXIDANT_SHUFFLE_SPILL_BYTES
              value: {{ .Values.connect.shuffleSpillBytes | quote }}
            {{- end }}
            {{- if .Values.connect.distributedStrict }}
            - name: OXIDANT_DISTRIBUTED_STRICT
              value: "1"
            {{- end }}
            {{- if .Values.connect.memoryLimitBytes }}
            - name: OXIDANT_MEMORY_LIMIT_BYTES
              value: {{ .Values.connect.memoryLimitBytes | quote }}
            {{- end }}
            {{- if .Values.connect.forceShuffleSpill }}
            - name: OXIDANT_SHUFFLE_SPILL_DIR
              value: /var/lib/oxidant/spill
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: spark-connect
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: spark-connect
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spill
              mountPath: /var/lib/oxidant/spill
          resources:
            {{- toYaml .Values.connect.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spill
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oxidant-connect
  labels:
    app: oxidant-connect
spec:
  type: {{ .Values.connect.serviceType }}
  selector:
    app: oxidant-connect
  ports:
    - name: spark-connect
      port: {{ .Values.connect.port }}
      targetPort: {{ .Values.connect.port }}
{{- end }}
