name: line coverage (nightly)

# llvm-cov line-coverage trend line for `main`, uploaded as an HTML artifact.
#
# The *gate* lives in ci.yml's `line coverage` job, which runs on every PR and fails below
# the `coverage-floor.json` ratchet. This workflow is the unbroken daily series for `main`,
# where a PR-triggered job gives you nothing. Trigger it by hand from the Actions tab when
# you want a fresh report.
#
# NOT `continue-on-error`, deliberately. It was, and that masked the truth for weeks: every
# run reported "success" at the workflow level while the job itself concluded `failure` on
# the export step. A trend job whose failures are invisible produces no trend.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: line-coverage
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  line-coverage:
    name: line coverage (nightly trend)
    runs-on: ubuntu-latest
    # ~45–60 min is a projection, not a measurement: this job has never completed a run —
    # every attempt so far died inside the build. 180 matches build-test's headroom.
    timeout-minutes: 180
    env:
      # Keep in sync with ci.yml line-coverage, including the reasoning recorded there:
      # debug = 0, because on Linux the linker copies DWARF into each of the ~160
      # instrumented test binaries and that — not memory — is what exhausts the runner
      # disk. Coverage does not need it; `-C instrument-coverage` emits its region and
      # filename tables independently of `-C debuginfo`.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with ci.yml line-coverage. The preinstalled SDKs are worth ~25 GB
      # (measured: 86 GB free -> 111 GB); the rest is headroom, each `|| true` so a runner
      # image that stops shipping one of them does not fail the job.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift /usr/local/share/powershell \
            /usr/share/miniconda /usr/local/lib/node_modules || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          df -h /
      - name: Set up Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup show
          rustup component add llvm-tools-preview
          rustc --version && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped from `llvm-cov` when this job moved to debug = 0. rust-cache keys on the
          # toolchain and Cargo.lock, not on CARGO_PROFILE_*, so the old key would restore
          # debug = 1 artifacts that this build cannot reuse and must still store — the one
          # thing this job has no room for. Bump again on any future profile change here.
          key: llvm-cov-debug0 # instrumented artifacts must not pollute the shared CI cache
      # Prebuilt binary. `cargo install cargo-llvm-cov --locked` compiled it from source
      # on every run, which cost more than the coverage pass itself.
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build oxidant CLI (integration tests spawn the binary under llvm-cov target dir)
        run: cargo build -p oxidant-cli --target-dir target/llvm-cov-target
      - name: Disk free before coverage
        run: df -h /
      # No `--jobs` cap: throttling build parallelism does not address the binding
      # constraint (runner disk — see the reclaim step above). Reinstate `--jobs 2` if a
      # future failure actually shows memory pressure rather than ENOSPC/SIGBUS.
      # Split build+run from export so the purge below sits between them — see the same
      # comment in ci.yml. A build killed mid-link leaves `<binary>-<hash>.tmpXXXXXX` in
      # debug/deps, rust-cache restores it, and `llvm-cov export` then fails with
      # "malformed instrumentation profile data: symbol name is empty". This is why every
      # run of this job so far ended in `failure` despite the workflow reporting success —
      # `continue-on-error: true` was masking it.
      - name: Collect coverage (build + run instrumented tests)
        run: cargo llvm-cov --workspace --no-report
      - name: Purge partial linker artifacts before export
        run: |
          # `|| true`: find exits non-zero if the tree is missing, and the step runs under
          # `bash -e`. Nothing to purge is a success, not a failure.
          found=$(find target/llvm-cov-target -name '*.tmp*' -type f -print -delete 2>/dev/null | wc -l || true)
          echo "purged ${found// /} partial linker artifact(s)"
      - name: Generate HTML coverage report
        run: cargo llvm-cov report --html
      - name: Disk free after coverage
        if: always()
        run: df -h /
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-html
          path: target/llvm-cov/html
          retention-days: 14
          if-no-files-found: ignore
