# This file was autogenerated by dist: https://axodotdev.github.io/cargo-dist
# — then RENAMED and HAND-ADAPTED. dist normally writes
# .github/workflows/release.yml, but that name belongs to our manual semver-bump
# workflow, so the dist pipeline lives here as binaries.yml and
# dist-workspace.toml sets `allow-dirty = ["ci"]` (dist will not check or
# regenerate this file). Hand edits on top of the generated output:
#   1. workflow renamed `Release` -> `binaries` (no collision with release.yml)
#   2. tag trigger restricted to `v*` (our release tags; e.g. archive/* tags ignored)
#   3. Homebrew tap commits use the github-actions[bot] identity
#   4. extra `package-linux` job: builds the two Linux targets natively and adds
#      .deb/.rpm packages (nfpm) to the same GitHub Release
#   5. added `workflow_dispatch` — tag-push triggers have proven unreliable in
#      this repo (two v0.1.0 tag pushes produced zero workflow events), and a
#      GITHUB_TOKEN push would not cascade anyway, so release.yml now fires this
#      pipeline explicitly via `gh workflow run --ref <tag>`
#   6. extra `preflight` job gating `plan`: refuses a tag that release.yml did not
#      cut (see the job for why v0.2.3-v0.2.5 shipped empty)
#   7. extra `verify-release` job: asserts the published release carries every
#      expected asset, because `package-linux` uploads *after* `host` publishes
# If you bump cargo-dist-version in dist-workspace.toml, regenerate locally with
# `dist generate` and re-apply these edits.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: binaries
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  # Fired explicitly by release.yml after it pushes a release tag (tag-push
  # triggers are unreliable here); the dist jobs key off github.ref being a tag.
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Refuse to build a tag that release.yml did not cut.
  #
  # v0.2.3, v0.2.4 and v0.2.5 were created straight from the GitHub Releases UI. That
  # makes a *lightweight* tag on whatever commit is at the head of main, and it skips
  # release.yml's `propose` job — the only thing that bumps the workspace version. All
  # three tags therefore pointed at a Cargo.toml still reading 0.2.2, and dist refused
  # them ("This workspace doesn't have anything for dist to Release!"). `plan` died in
  # ~30s, every later job was skipped, and three assetless releases went public; the
  # newest of them took over the `latest` pointer that README.md's install line follows.
  #
  # dist already fails on this, just illegibly and too late to stop the release object
  # from existing. This job says why in one line, and puts the release back into draft
  # so a hand-cut tag cannot sit on `latest` while someone works out what happened.
  preflight:
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the tag object itself, which a shallow checkout does not fetch.
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must match the workspace version and come from release.yml
        # PR runs (pr-run-mode = "plan") have no tag to check.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          bad=""

          # Distinguish "not fetched" from "lightweight" so a checkout problem is never
          # reported as a process violation.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG is not present in the checkout; cannot verify it. This is a" \
                 "checkout problem, not a bad tag."
            exit 1
          fi

          # release.yml:262 creates annotated tags (`git tag -a`). The GitHub UI and a
          # bare `git tag` create lightweight ones, so this is the cheapest possible
          # signal that the tag bypassed the release workflow.
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            bad="yes"
            echo "::error::$TAG is a lightweight tag. Release tags must be cut by release.yml," \
                 "which creates them annotated. Do not use the GitHub Releases UI or \`gh release create\`."
          fi

          if [ "$TAG" != "v${VERSION}" ]; then
            bad="yes"
            echo "::error::tag $TAG does not match the workspace version in Cargo.toml (${VERSION})." \
                 "release.yml's propose job bumps Cargo.toml/Cargo.lock through a PR; that step was skipped," \
                 "so dist has nothing to release and every artifact job would be skipped."
          fi

          if [ -n "$bad" ]; then
            # Get the broken release off `latest` immediately. Drafting rather than
            # deleting: reversible, and it keeps whatever release notes were written.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft
              echo "::warning::moved release $TAG back to draft so it cannot serve as \`latest\`"
            fi
            echo "::error::To release: label a PR patch/minor/major, or Actions -> release -> Run workflow."
            exit 1
          fi

          echo "$TAG matches Cargo.toml ($VERSION) and is annotated."

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    needs: preflight
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "github-actions[bot]"
      GITHUB_EMAIL: "github-actions[bot]@users.noreply.github.com"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          repository: "OxidantData/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  # HAND-ADDED (not dist-generated): .deb/.rpm packages via nfpm.
  # Builds the two Linux targets on native-arch runners inside manylinux_2_34
  # containers (glibc 2.34 floor — KAN-61, matching the dist tarball legs),
  # packages each with nfpm (packaging/nfpm.yaml), and attaches the packages to
  # the GitHub Release that the dist `host` job just created. Runs after `host`
  # because the Release must exist before `gh release upload`; skipped on PRs
  # because `host` is skipped.
  package-linux:
    name: package-linux (${{ matrix.target }})
    needs:
      - plan
      - host
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            pkg-arch: amd64
            img-arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            pkg-arch: arm64
            img-arch: aarch64
    runs-on: ${{ matrix.runner }}
    # KAN-61: build inside manylinux_2_34 (AlmaLinux 9, glibc 2.34) so the packaged
    # binaries run on RHEL 9 / Amazon Linux 2023 and newer — same container family
    # and floor as the dist tarball builds (see dist-workspace.toml).
    container: quay.io/pypa/manylinux_2_34_${{ matrix.img-arch }}:2026.08.05-1
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_INCREMENTAL: "0"
      NFPM_VERSION: 2.47.0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      # manylinux has git/gcc/cmake/perl but no Rust toolchain and no gh CLI.
      # safe.directory: the runner-side checkout is owned by the runner uid, so
      # in-container git (and gh, which shells out to git) refuses it as
      # "dubious ownership" — this bit the v0.1.1 `gh release upload` step.
      - name: Set up Rust toolchain + GitHub CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup show
          rustc --version && cargo --version
          curl --proto '=https' --tlsv1.2 -LsSfO \
            "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_${{ matrix.pkg-arch }}.rpm"
          dnf install -y "gh_2.97.0_linux_${{ matrix.pkg-arch }}.rpm"
          gh --version

      # Read-only restore of the shared CI cargo cache (see ci.yml for why there
      # is exactly one writer); tag builds never save back.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false

      - name: Build oxidant (${{ matrix.target }})
        run: cargo build --release -p oxidant-cli --target ${{ matrix.target }}

      - name: Install nfpm
        run: |
          curl --proto '=https' --tlsv1.2 -LsSfO \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm-${NFPM_VERSION}-1.${{ matrix.img-arch }}.rpm"
          dnf install -y "nfpm-${NFPM_VERSION}-1.${{ matrix.img-arch }}.rpm"
          nfpm --version

      - name: Package .deb + .rpm
        run: |
          PKG_VERSION="${{ needs.plan.outputs.tag }}"
          export PKG_VERSION="${PKG_VERSION#v}"
          export TARGET="${{ matrix.target }}"
          export PKG_ARCH="${{ matrix.pkg-arch }}"
          mkdir -p dist-packages
          for packager in deb rpm; do
            nfpm package --config packaging/nfpm.yaml --packager "$packager" --target dist-packages/
          done
          ls -la dist-packages/

      - name: Upload packages to the GitHub Release
        # --repo: resolve via the API instead of gh shelling out to git.
        run: gh release upload "${{ needs.plan.outputs.tag }}" dist-packages/* --clobber --repo ${{ github.repository }}

      # The curl|sh installer only installs the binary (cargo-dist ships no data
      # files), so the bundled sample tables need a standalone download for that
      # install path — documented in docs/getting-started.md. One matrix leg is
      # enough; the archive is platform-independent.
      - name: Upload sample-data archive to the GitHub Release
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          tar -czf sample-data.tar.gz sample-data
          gh release upload "${{ needs.plan.outputs.tag }}" sample-data.tar.gz --clobber --repo ${{ github.repository }}

  # Assert the published release actually carries everything before anything announces it.
  #
  # `host` publishes the release, and only then does `package-linux` upload the .deb/.rpm
  # and sample-data.tar.gz (it needs the release to exist for `gh release upload`). With
  # fail-fast: false on that matrix, one arch can fail and leave a live, public, incomplete
  # release — and sample-data.tar.gz uploads from the x86_64 leg alone, so losing that one
  # leg silently breaks the download that docs/getting-started.md tells users to curl.
  verify-release:
    needs:
      - plan
      - host
      - package-linux
      - publish-homebrew-formula
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Every expected asset is attached and non-empty
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          VERSION="${TAG#v}"

          # name<TAB>size for what actually landed on the release.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name)\t\(.size)"' > actual.tsv

          missing=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            size=$(awk -F'\t' -v n="$name" '$1 == n {print $2}' actual.tsv)
            if [ -z "$size" ]; then
              echo "::error::release $TAG is missing asset $name"
              missing=1
            elif [ "$size" -eq 0 ]; then
              echo "::error::release $TAG has a zero-byte asset $name"
              missing=1
            fi
          done < <(./scripts/release-expected-assets.sh "$VERSION")

          if [ "$missing" -ne 0 ]; then
            echo "::error::$TAG is incomplete. Re-run the failed job, then re-run this one;" \
                 "do not leave the release published in this state."
            exit 1
          fi
          echo "$TAG carries every expected asset."

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
      # Hand-added: without these the workflow reports success while the release is
      # missing its .deb/.rpm/sample-data, because package-linux runs after `host`
      # has already published and does not fail-fast.
      - package-linux
      - verify-release
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && needs.verify-release.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
