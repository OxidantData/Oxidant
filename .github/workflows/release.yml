name: release

# Semver release: bumps Cargo.toml workspace version, commits, tags (annotated),
# pushes, then explicitly dispatches the two release pipelines: binaries.yml
# (GitHub Release: tarballs, curl installer, Homebrew formula, .deb/.rpm) and
# oxidant-image.yml (GHCR manifest ghcr.io/oxidantdata/oxidant :X.Y.Z, :X.Y, :X).
# Tag pushes are NOT relied upon: GITHUB_TOKEN pushes don't cascade to other
# workflows, and tag-push triggers have proven unreliable in this repo —
# workflow_dispatch via the API always lands.
#
# How to release:
#   1. Label the PR `patch`, `minor`, or `major` before merging to main — the
#      merge triggers this workflow automatically. If several labels are present,
#      precedence is major > minor > patch.
#   2. Or: Actions → release → Run workflow → choose patch / minor / major.
#
# Ordinary merges (no release label) do NOT release. The version bump commit
# carries [skip ci] so only the dispatched tag builds run the expensive pipelines.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to increment"
        required: true
        type: choice
        options: [patch, minor, major]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  # Dispatching binaries.yml / oxidant-image.yml via the API needs actions:write —
  # without it the bumper's final step 403s ("Resource not accessible by
  # integration") after the tag is already pushed (bit v0.1.1's release run).
  actions: write
  pull-requests: read

jobs:
  release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'patch') ||
        contains(github.event.pull_request.labels.*.name, 'minor') ||
        contains(github.event.pull_request.labels.*.name, 'major')))
    runs-on: ubuntu-latest
    steps:
      # `main` requires status checks (rustfmt / clippy + test / coverage gates /
      # line coverage). Those apply to direct pushes, not just merges, and the release
      # commit is made with `[skip ci]`, so it never has any — GITHUB_TOKEN's push to
      # main is rejected. Only an admin bypasses (branch protection sets
      # enforce_admins: false), and GitHub Actions cannot be granted a bypass: ruleset
      # bypass actors must be installed GitHub Apps, and Actions is built in, not
      # installed. So this needs RELEASE_TOKEN — a PAT (contents: write) belonging to a
      # repo admin.
      - name: Require the release token
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_TOKEN is not set. main requires status checks, and the" \
                 "release commit is pushed directly with [skip ci], so it has none —" \
                 "GITHUB_TOKEN's push would be rejected after the version bump was already" \
                 "committed locally. Add a repo secret RELEASE_TOKEN: a PAT with" \
                 "contents: write owned by a repo admin (admins bypass required checks)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve bump kind
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Label precedence when multiple are present: major > minor > patch.
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | jq -e 'index("major")' >/dev/null; then
            echo "kind=major" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | jq -e 'index("minor")' >/dev/null; then
            echo "kind=minor" >> "$GITHUB_OUTPUT"
          elif echo "$labels" | jq -e 'index("patch")' >/dev/null; then
            echo "kind=patch" >> "$GITHUB_OUTPUT"
          else
            echo "merged PR has no patch/minor/major label" >&2
            exit 1
          fi

      - name: Bump workspace version
        id: ver
        run: |
          CURRENT=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.kind }}" in
            major) NEW="$((MAJOR+1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW}\"/" Cargo.toml
          echo "old=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW}"  >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}"     >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        run: |
          # Sync Cargo.lock with the new workspace version — `cargo metadata
          # --no-deps` does NOT rewrite member versions, `cargo tree` does
          # (the Dockerfile builds with `--locked`; v0.1.0's image build died
          # on the stale lock).
          cargo tree --depth 0 -p oxidant-cli > /dev/null
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release ${{ steps.ver.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "release ${{ steps.ver.outputs.tag }}"
          git push origin main
          git push origin "refs/tags/${{ steps.ver.outputs.tag }}"

      - name: Dispatch release pipelines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatch is exempt from the GITHUB_TOKEN cascade suppression
          # (and tag-push triggers are unreliable in this repo), so fire both
          # release pipelines explicitly on the new tag.
          gh workflow run binaries.yml --ref "${{ steps.ver.outputs.tag }}"
          gh workflow run oxidant-image.yml --ref "${{ steps.ver.outputs.tag }}"

      - name: Job summary
        run: |
          {
            echo "### Released \`${{ steps.ver.outputs.tag }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Previous version | \`${{ steps.ver.outputs.old }}\` |"
            echo "| New version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| Bump | \`${{ steps.bump.outputs.kind }}\` |"
            echo "| Git tag | \`${{ steps.ver.outputs.tag }}\` |"
            echo ""
            echo "Dispatched **binaries** (GitHub Release: tarballs, curl installer,"
            echo "Homebrew formula, .deb/.rpm) and **oxidant-image**, publishing:"
            echo "- \`ghcr.io/oxidantdata/oxidant:${{ steps.ver.outputs.version }}\`"
            echo "- \`ghcr.io/oxidantdata/oxidant:$(echo ${{ steps.ver.outputs.version }} | cut -d. -f1,2)\`"
            echo "- \`ghcr.io/oxidantdata/oxidant:$(echo ${{ steps.ver.outputs.version }} | cut -d. -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
